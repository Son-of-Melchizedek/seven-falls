// Shared frame: arena, both fighters, the stat blocks and the message band.
function renderCombatStage(){
  const d = combat.demon;
  const tkey = demonTypeKey(d);

  // Screen shake
  if (game.shakeTimer > 0 && game.shakeIntensity) {
    const intensity = game.shakeIntensity * (game.shakeTimer / 0.4);
    ctx.save();
    ctx.translate((Math.random()-0.5)*intensity*2, (Math.random()-0.5)*intensity*2);
  }

  // ══ BACKGROUND ══
  rect(0, 0, W, H, C.bg);
  texRect(0, 0, W, H, C.bg);
  // arena floor with gradient
  const floorGrad = ctx.createLinearGradient(0, 180, 0, H);
  floorGrad.addColorStop(0, '#0c0c1a');
  floorGrad.addColorStop(1, '#060610');
  ctx.fillStyle = floorGrad;
  ctx.fillRect(0, 180, W, H - 180);
  // subtle floor line
  ctx.strokeStyle = 'rgba(100,100,160,0.12)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, 180); ctx.lineTo(W, 180); ctx.stroke();
  // grid lines (subtle)
  ctx.strokeStyle = 'rgba(80,80,140,0.06)';
  for (let gx = 0; gx <= W; gx += 16){ ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
  for (let gy = 0; gy <= H; gy += 16){ ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); }

  const selTypes = selectedTypes();

  // ══ TOP SECTION (y:0-56) — Enemy area ══
  // 1.5 logical scale == 3 device px per art pixel at RS=2, so the enlarged
  // boss sprite stays perfectly crisp while it fills the enemy stage.
  const eScale = DEMON_SPRITE_SC * 1.5;
  const ex = 312, ey = 72;
  const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 420);
  const glow = ctx.createRadialGradient(ex, ey + 12, 4, ex, ey + 12, 74);
  glow.addColorStop(0, 'rgba(255,120,90,' + (0.16 + 0.05 * pulse) + ')');
  glow.addColorStop(1, 'rgba(255,120,90,0)');
  ctx.fillStyle = glow; ctx.fillRect(ex - 80, 0, 160, 108);
  drawDemonAny(ex, ey, d, true, eScale, 'rgba(255,180,120,0.55)',
    typeof SpriteStates !== 'undefined' ? SpriteStates.get('demon') : null);

  // The player, drawn at the enemy's own scale (96x90) and before the HUD so
  // every label stays legible on top of him. Feet on the floor of the stage.
  // eScale * 1.1: the Child of God reads a touch larger than a common demon.
  drawWarriorSprite(56, 104, true, eScale * 1.1);

  // #5 CAST: the telegraph the player can break by landing the weak type. Drawn
  // in the enemy's stat column (under the HP numbers), not over the player row.
  if (typeof Deep !== 'undefined') Deep.renderCastBar(116, 43);

  text((TIER_NAMES[d.tier] || 'Demon').toUpperCase(), 116, 4, TIER_COLORS[d.tier] || C.white, 6, 'left');
  text(d.name, 116, 12, C.red, 8, 'left');
  let badgeY = 23;
  if (combat.isElite) text('ELITE', 116, badgeY, C.purple, 5, 'left');
  else if (combat.isRival) text('RIVAL', 116, badgeY, C.red, 5, 'left');
  else if (combat.isNemesis) text('NEMESIS', 116, badgeY, C.red, 5, 'left');
  else if (combat.isBoss) text('BOSS', 116, badgeY, C.red, 5, 'left');
  bar(116, 30, 150, 8, (typeof Polish !== 'undefined' ? Polish.hpFrac('demon', Math.max(0, d.hp) / d.maxHp) : Math.max(0, d.hp) / d.maxHp), C.red);
  text(Math.max(0, Math.ceil(d.hp)) + '/' + d.maxHp, 191, 40, C.white, 5, 'center');

  const hint = combat.revealedWeak || KnowledgeSystem.getWeaknessHint(tkey);
  if (hint){
    if (hint.indexOf('Unknown') === 0) text(hint, 116, 51, C.dim, 5, 'left');
    else text('Weak: ' + hint + ' verses', 116, 51, C.cyan, 5, 'left');
  } else {
    text('Weakness: ?', 116, 51, C.dim, 5, 'left');
  }

  // twist / state badges (right of enemy, below weakness)
  if (combat.resistance) text('RESIST ' + combat.resistance, W-6, 4, C.red, 5, 'right');
  const ati = CombatTwists.getActiveTwistInfo();
  if (ati.length){
    let ty = 11;
    for (const t of ati){
      if (combat.resistance && t.type === 'adaptive') continue;
      text('⟁ ' + t.name, W-6, ty, C.purple, 5, 'right'); ty += 7;
    }
  }
  if (combat.isSwarm) text('SWARM ' + Math.ceil(combat.swarmTimer) + 's', W-6, 50, C.red, 5, 'right');
  if (combat.adds && combat.adds.length) text('+ ' + combat.adds.length + ' ADD', W-6, 57, C.purple, 5, 'right');
  if (combat.stunTurns > 0) text('STUNNED ' + combat.stunTurns, W-6, 64, C.gold, 5, 'right');

  // ══ MESSAGE AREA (y:58-80) ══
  if (combat.msgTimer > 0){
    // The message band was centred at x=206 and wrapped at 246px — both hard numbers
    // from the original 384-wide layout. On a wider phone that squeezed the text into
    // a narrow column with the right half of the band empty.
    const msgCX = Math.round(W / 2);
    const msgW = Math.max(240, W - 44);
    const ml = wrapTextPx(combat.message, msgW, 6);
    let my = 60; for (const l of ml.slice(0,2)){ text(l, msgCX, my, C.holy, 6, 'center'); my += 9; }
    if (combat.comboResult){
      const ql = wrapTextPx(combat.comboResult.quote, msgW, 5);
      for (const l of ql.slice(0,2)){ text(l, msgCX, my, C.gold, 5, 'center'); my += 8; }
    }
    // wrap instead of letting the guard clip a long twist line into a single
    // ellipsised fragment — these strings name what the demon just did
    for (const tm of combat.twistTriggered.slice(-1)){
      for (const l of wrapTextPx(tm, msgW, 5).slice(0, 2)){ text(l, msgCX, my, C.red, 5, 'center'); my += 8; }
    }
    combat.twistTriggered = [];
  }
  if (game.comboAnim > 0){
    const a = Math.min(1, game.comboAnim / 1.2);
    ctx.save();
    ctx.globalAlpha = a;
    const sc = 1 + (1 - a) * 0.6;
    ctx.font = Math.floor(14 * sc) + 'px "Press Start 2P", monospace';
    ctx.fillStyle = C.gold; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText('COMBO!', W/2, 60 - (1 - a) * 8);
    ctx.restore();
  }

  // ══ PLAYER STATS (y:82-104) ══
  // The player is a Child of God, not a warrior — the label is the identity the
  // whole run hangs on, so it is spelled out in full. It sits in the middle
  // column now that the hero himself owns the left of the stage.
  text('CHILD OF GOD', 116, 84, C.holy, 7, 'left');
  bar(116, 94, 130, 8, (typeof Polish !== 'undefined' ? Polish.hpFrac('player', Math.max(0, game.hp) / game.maxHp) : Math.max(0, game.hp) / game.maxHp), C.green);
  text(Math.max(0, game.hp) + '/' + game.maxHp, 181, 103, C.white, 5, 'center');
  let px = 226;
  if (game.shield > 0){ text('🛡 ' + game.shield, px, 84, C.cyan, 5, 'left'); }
  if (combat.buffNext > 0){ text('⚔ BUF', px, 94, C.gold, 5, 'left'); px += 40; }
  if (game.defenseBuff > 0){ text('✦DEF ' + game.defenseBuff, px, 84, C.green, 5, 'left'); }

  if (game.shakeTimer > 0) ctx.restore();
}

// ── FIGHT: assemble a verse from the pool ──
function renderCombatFight(){
  const d = combat.demon;
  const tkey = demonTypeKey(d);
  renderCombatStage();
  // ══ VERSE REFERENCE BOX (y:104-126) — the hand you can build from ══
  const refY = 104, refH = 22;
  rect(6, refY, W-12, refH, '#14152e');
  strokeRect(6, refY, W-12, refH, C.gold);
  text('VERSE', 10, refY+8, C.gold, 6, 'left');
  // Equal-width chips sized to the device, so ALL of the hand is visible and tappable.
  // The old code let the label and the first ref share the same pixels, and skipped any
  // ref that ran past the right edge.
  const tgt = (typeof combat.target === 'number') ? combat.target : 0;
  const labelW = 40, gap = 4;
  const nCh = combat.verses.length;
  const rowX = 10 + labelW;
  const chipW = Math.max(30, Math.floor((W - 8 - rowX - (nCh - 1) * gap) / Math.max(1, nCh)));
  const chipY = refY + 3, chipH = refH - 6;
  combat.verses.forEach((vc, vi) => {
    const col = verseTypeColor(vc.type);
    const isTarget = (vi === tgt);
    const cx = rowX + vi * (chipW + gap);
    if (isTarget){
      roundRectPath(cx, chipY, chipW, chipH, 3);
      ctx.fillStyle = '#2b2554'; ctx.fill();
    }
    strokeRect(cx, chipY, chipW, chipH, isTarget ? C.gold : col);
    // marker + reference, truncated by MEASUREMENT so nothing spills out of its chip
    let label = String(vc.reference || '');
    const inner = chipW - 14;
    while (label.length > 3 && ctx.measureText(label).width > inner) label = label.slice(0, -2);
    ctx.fillStyle = col; ctx.fillRect(cx + 4, chipY + Math.floor(chipH / 2) - 2, 4, 4);
    text(label, cx + 11, chipY + 3, isTarget ? C.white : col, 6, 'left');
    clickables.push({ x: cx, y: chipY, w: chipW, h: chipH, onClick: () => setTargetVerse(vi) });
  });
  text('TAP TO BUILD', 10, refY + 14, C.dim, 4, 'left');

  // ══ SELECTED WORDS AREA — auto-sizes to fit the verse ══
  const selWords = combat.selected.map(i => combat.pool[i].word);
  const selText = selWords.join(' ');
  // Measure how many lines we need
  setFont(Math.round(7 * S));
  const maxLineW = W - 24;
  const words2 = selText.split(' ');
  const lines2 = []; let line2 = '';
  for (const w of words2) {
    const test = line2 ? line2 + ' ' + w : w;
    if (ctx.measureText(test).width > maxLineW && line2) { lines2.push(line2); line2 = w; } else line2 = test;
  }
  if (line2) lines2.push(line2);
  const numLines = Math.max(1, lines2.length);
  // Font size adapts: shrink if >2 lines
  let fontSize = numLines <= 2 ? 7 : (numLines <= 3 ? 6 : 5);
  const lineH = fontSize + 4;
  const selH = Math.max(20, numLines * lineH + 8);
  const selY = 128;
  rect(6, selY, W-12, selH, C.stoneDark);
  strokeRect(6, selY, W-12, selH, C.holy);
  if (selWords.length === 0) {
    text('Tap words above...', 12, selY + selH/2 - 4, C.dim, 7, 'left');
  } else {
    setFont(Math.round(fontSize * S));
    let sy = selY + 4;
    for (const l of lines2) {
      text(l, 12, sy, C.holy, fontSize, 'left');
      sy += lineH;
    }
  }

  // ══ WORD POOL — starts below the auto-sized selection area ══
  // #3 INSCRIPTION strip sits between the selection box and the word pool: it
  // declares the verse type, the word cost against the per-turn budget, and how
  // many useful words remain.
  if (typeof Deep !== 'undefined') Deep.renderInscription(selY + selH + 3);
  const startY = selY + selH + 15;
  // columns follow the device width so tiles keep a sane size instead of stretching
  const cols = Math.max(4, Math.min(10, Math.round((W - 12) / 78))), gx = 2, gy = 3;
  // Fit EVERY pool tile on screen. The grid used to hard-break at y+bh > 243,
  // so any pool longer than the last row left words invisible AND unclickable —
  // which made those verses impossible to complete. Tile height adapts to pool size.
  const _rows = Math.max(1, Math.ceil(combat.pool.length / cols));
  const _avail = Math.max(24, 243 - startY);
  const bh = Math.max(9, Math.min(30, Math.floor(_avail / _rows) - gy));
  const bw = Math.floor((W - 8 - (cols - 1) * gx) / cols);
  // ── ONE uniform label size for the whole grid ──
  // Chosen so the longest word in the pool fits its tile with padding on both
  // sides. Shrinking each label independently made long words sit flush against
  // the border and short words look lost; a single size reads as designed.
  const PAD_L = 12, PAD_R = 8;
  const innerW = bw - PAD_L - PAD_R;
  // Measure at the font we will ACTUALLY draw with — measureText returns widths
  // in the same logical units as the tile geometry, so scaling it by hand gets
  // the answer wrong (that bug drew long words ~33px past their border).
  // Cached per pool: the fit is a property of the words, not of the frame.
  const poolKey = combat.pool.length + '|' + combat.pool.map(t => t.word).join(',') + '|' + innerW;
  if (combat._tileFitKey !== poolKey){
    let best = 3.5;
    for (let sz = 7; sz >= 3.5; sz -= 0.25){
      setFont(Math.round(sz * S));
      let widest = 0;
      for (const tk of combat.pool){
        const w = ctx.measureText(String(tk.word)).width;
        if (w > widest) widest = w;
        if (widest > innerW) break;
      }
      if (widest <= innerW){ best = sz; break; }
    }
    combat._tileFit = best;
    combat._tileFitKey = poolKey;
  }
  const lsize = combat._tileFit || 5;
  for (let i = 0; i < combat.pool.length; i++){
    const c = i % cols, row = Math.floor(i / cols);
    const x = 6 + c * (bw + gx);
    const y = startY + row * (bh + gy);
    if (y + bh > 243) break;
    const used = combat.selected.includes(i);
    const tok = combat.pool[i];
    const vcol = tok.v >= 0 ? verseTypeColor(combat.verses[tok.v].type) : (tok.v === -2 ? C.purple : C.dim);
    const isNextWord = (game.verseHighlight >= 0 && tok.word.toLowerCase() === getExpectedWord() && !used);
    const hovered = pointIn(pointer.x, pointer.y, x, y, bw, bh) && !used;
    const ty = y + (hovered ? -1 : 0);
    // body: dark plate with a lit top edge — reads as a key you press
    rect(x, ty, bw, bh, used ? '#d9b25a' : (hovered ? '#1b1e40' : '#11122a'));
    rect(x + 1, ty + 1, bw - 2, 1, used ? '#f2d98f' : '#242a52');
    // 1px notch out of each corner: the pixel-art cue for "this is a button"
    rect(x, ty, 1, 1, C.bg); rect(x + bw - 1, ty, 1, 1, C.bg);
    rect(x, ty + bh - 1, 1, 1, C.bg); rect(x + bw - 1, ty + bh - 1, 1, 1, C.bg);
    strokeRect(x, ty, bw, bh, used ? C.white : vcol);
    // left accent in the verse-type colour, inset so it never touches the border
    ctx.fillStyle = used ? '#1a1526' : vcol;
    ctx.fillRect(x + 2, ty + 2, 3, bh - 4);
    // #4 LINKS + junk crowding on the tile itself
    if (typeof Deep !== 'undefined') Deep.decorateTile(i, tok, x, ty, bw, bh, vcol);
    const label = tok.word;
    const glyphH = lsize * (S / RS);            // logical px the glyphs actually occupy
    const ly = ty + Math.max(1, Math.round((bh - glyphH) / 2));
    if (isNextWord){
      ctx.save(); ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 10;
      text(label, x + PAD_L, ly, C.gold, lsize, 'left');
      ctx.restore();
    } else {
      text(label, x + PAD_L, ly, used ? '#1a1526' : C.white, lsize, 'left');
    }
    clickables.push({ x, y, w: bw, h: bh, onClick: () => selectWord(i) });
  }

  // ══ BOTTOM ACTION BAR (y:247-261) — timer, items, run, bible ══
  // Timer thin bar (just below pool) — only counts down when enabled
  const tFrac = game.timerEnabled
    ? Math.max(0, Math.min(1, combat.timer / combat.maxTimer))
    : Math.min(1, combat.timer / Math.max(1, combat.maxTimer * 3));
  const tCol = tFrac > 0.5 ? C.green : tFrac > 0.2 ? C.gold : C.red;
  rect(6, 245, W-12, 2, C.stone);
  rect(6, 245, (W-12) * tFrac, 2, tCol);

  // Submit / Clear / Undo, then the way back to the menu.
  rect(0, 243, W, 1, 'rgba(150,135,215,0.20)');
  button(6, 247, 44, 14, 'HIT', () => submitVerse(), C.gold, C.bg, C.gold);
  button(54, 247, 38, 14, 'CLR', () => clearSelection(), C.blue, C.white, C.stone);
  button(96, 247, 38, 14, 'UNDO', () => { if (combat && combat.selected.length > 0) combat.selected.pop(); }, C.dim, C.white, C.stone);
  text('Spell the verse, then HIT', 140, 250, C.dim, 5, 'left');
  button(W-72, 247, 66, 14, 'BACK', () => setCombatScreen('MENU'), C.dim, C.white, C.stone);
  drawCombatFX();
}

// ── BATTLE MENU: the four choices, each explaining itself ──
function combatMenuTiles(){
  const gap = 6;
  const cw = Math.floor((W - 16 - gap) / 2);
  const ch = 52;
  const y0 = 132;
  return [
    { id: 'FIGHT', x: 8, y: y0, w: cw, h: ch },
    { id: 'BIBLE', x: 8 + cw + gap, y: y0, w: cw, h: ch },
    { id: 'ITEMS', x: 8, y: y0 + ch + gap, w: cw, h: ch },
    { id: 'RUN',   x: 8 + cw + gap, y: y0 + ch + gap, w: cw, h: ch },
  ];
}
function menuCopy(id){
  const items = game.items || [];
  const uses = Math.max(0, (combat && combat.bibleUses) || 0);
  const pct = (typeof calcEscapeChance === 'function') ? calcEscapeChance() : 0;
  if (id === 'FIGHT') return { title: 'FIGHT', sub: 'Build a verse',
                               detail: 'Tap words to spell it, then HIT.' };
  if (id === 'BIBLE') return { title: 'BIBLE', sub: uses > 0 ? ('Use a verse - ' + uses + ' left') : 'No uses left',
                               detail: uses > 0 ? 'Fire a verse instantly.' : 'Spent for this battle.' };
  if (id === 'ITEMS') return { title: 'ITEMS', sub: items.length + '/5 carried',
                               detail: items.length ? 'Using one takes your turn.' : 'You carry nothing.' };
  if (id === 'RUN') return { title: 'RUN', sub: pct + '% to escape',
                             detail: 'Fail and it strikes you.' };
  return { title: id, sub: '', detail: '' };
}
function renderCombatMenu(){
  renderCombatStage();
  text('What will you do?', 10, 120, C.dim, 5, 'left');
  const tiles = combatMenuTiles();
  for (const t of tiles){
    const hovered = pointIn(pointer.x, pointer.y, t.x, t.y, t.w, t.h);
    const c = menuCopy(t.id);
    roundRectPath(t.x, t.y, t.w, t.h, 5);
    const g = ctx.createLinearGradient(0, t.y, 0, t.y + t.h);
    const base = t.id === 'FIGHT' ? '#3a3220' : (t.id === 'BIBLE' ? '#2b2350' : (t.id === 'ITEMS' ? '#1d2c40' : '#3a1d24'));
    g.addColorStop(0, shadeColor(base, hovered ? 34 : 16));
    g.addColorStop(1, shadeColor(base, hovered ? 10 : -6));
    ctx.fillStyle = g; ctx.fill();
    strokeRect(t.x, t.y, t.w, t.h, t.id === 'FIGHT' ? C.gold : (t.id === 'BIBLE' ? C.purple : (t.id === 'ITEMS' ? C.blue : C.red)));
    const cx = t.x + t.w / 2;
    // Every wrapped line needs its own y: drawing them all at the same baseline
    // overprinted the words on top of each other inside the tile.
    let ty = t.y + 7;
    text(c.title, cx, ty, C.white, 9, 'center'); ty += 17;   // clear of the title's glyphs
    for (const l of wrapTextPx(c.sub, t.w - 14, 5)){
      if (ty > t.y + t.h - 14) break;
      text(l, cx, ty, C.cyan, 5, 'center'); ty += 7;
    }
    for (const l of wrapTextPx(c.detail, t.w - 12, 4)){
      if (ty > t.y + t.h - 6) break;
      text(l, cx, ty, C.dim, 4, 'center'); ty += 6;
    }
    clickables.push({ x: t.x, y: t.y, w: t.w, h: t.h, onClick: () => {
      if (t.id === 'FIGHT') setCombatScreen('FIGHT');
      else if (t.id === 'BIBLE') setCombatScreen('BIBLE');
      else if (t.id === 'ITEMS') setCombatScreen('ITEMS');
      else if (t.id === 'RUN') tryFlee();
    }});
  }
  drawCombatFX();
}

// ── BIBLE: your verses, usable ──
function biblePageRows(){
  return KnowledgeSystem.store.discoveredVerses || [];
}
function renderCombatBible(){
  renderCombatStage();
  const uses = Math.max(0, combat.bibleUses || 0);
  text('BIBLE', 10, 118, C.purple, 9, 'left');
  text(uses > 0 ? ('One verse, free of charge - ' + uses + ' use' + (uses === 1 ? '' : 's') + ' left') : 'No uses left this battle',
       10, 130, uses > 0 ? C.cyan : C.red, 5, 'left');
  const ids = biblePageRows();
  const y0 = 142, rowH = 21, maxRows = Math.max(1, Math.floor((242 - y0) / rowH));
  // A DEDICATED page counter: game.biblePage belongs to the full Bible UI and holds
  // page NAMES ('overview'), so doing arithmetic on it produced NaN and sliced an
  // empty list — the list looked blank with paging that "worked".
  const pageNum = Math.max(0, Math.min(combat.biblePageNum || 0, Math.max(0, Math.ceil(ids.length / maxRows) - 1)));
  const start = pageNum * maxRows;
  const slice = ids.slice(start, start + maxRows);
  if (!ids.length){
    text('You have not discovered any verses yet.', 10, y0 + 8, C.dim, 6, 'left');
  }
  slice.forEach((id, i) => {
    const v = (typeof getVerseById === 'function') ? getVerseById(id) : null;
    if (!v) return;
    const y = y0 + i * rowH;
    rect(8, y, W - 16, rowH - 4, i % 2 ? '#12132a' : '#161735');
    strokeRect(8, y, W - 16, rowH - 4, verseTypeColor(v.type));
    text(String(v.reference || ''), 14, y + 4, C.white, 6, 'left');
    const bw2 = 62, bx2 = W - 12 - bw2, by2 = y + 2, bh2 = rowH - 8;
    // type sits in a column just left of USE: a fixed offset collided with longer
    // references ("Ephesians 6:11WISDOM")
    text(String(v.type || '').toUpperCase(), bx2 - 8, y + 5, verseTypeColor(v.type), 5, 'right');
    const bw = bw2, bx = bx2, by = by2, bh = bh2;
    const enabled = uses > 0;
    button(bx, by, bw, bh, enabled ? 'USE' : 'SPENT', () => { if (enabled) bibleUse(id); }, enabled ? C.purple : C.dim, C.white, C.stone);
    clickables.push({ x: bx, y: by, w: bw, h: bh, onClick: () => { if (enabled) bibleUse(id); } });
  });
  // paging + back
  const maxPage = Math.max(0, Math.ceil(ids.length / maxRows) - 1);
  if (maxPage > 0){
    button(8, 247, 54, 14, 'PREV', () => { combat.biblePageNum = Math.max(0, pageNum - 1); }, C.dim, C.white, C.stone);
    button(68, 247, 54, 14, 'NEXT', () => { combat.biblePageNum = Math.min(maxPage, pageNum + 1); }, C.dim, C.white, C.stone);
    text('page ' + (pageNum + 1) + '/' + (maxPage + 1), 128, 250, C.dim, 5, 'left');
  }
  button(W-72, 247, 66, 14, 'BACK', () => setCombatScreen('MENU'), C.dim, C.white, C.stone);
  drawCombatFX();
}
// Fire a verse straight from the Bible: it becomes the verse being built, its words
// are spelled out of the pool, and the normal damage pipeline resolves the turn.
function bibleUse(id){
  if (!combat || game.state !== 'COMBAT') return;
  if ((combat.bibleUses || 0) <= 0){
    combat.message = 'The Bible is spent for this battle.';
    combat.msgTimer = 2.0; return;
  }
  const v = (typeof getVerseById === 'function') ? getVerseById(id) : null;
  if (!v) return;
  let idx = (combat.verses || []).findIndex(x => x && x.id === id);
  if (idx < 0){
    combat.verses = combat.verses || [];
    const slot = Math.max(0, Math.min(combat.target || 0, combat.verses.length - 1));
    combat.verses[slot] = v;
    idx = slot;
  }
  combat.target = idx;
  if (!combat.usedWords) combat.usedWords = new Set();
  rebuildPool();
  const need = verseWords(combat.verses[idx]);
  const used = new Set(); const picks = [];
  for (const w of need){
    let found = -1;
    for (let i = 0; i < combat.pool.length; i++)
      if (!used.has(i) && combat.pool[i].word === w){ found = i; break; }
    if (found < 0){ combat.message = 'That verse cannot be formed here.'; combat.msgTimer = 2.0; return; }
    used.add(found); picks.push(found);
  }
  combat.bibleUses--;
  combat.selected = picks;
  combat.screen = 'FIGHT';
  if (typeof SFX !== 'undefined') SFX.play('buff');
  submitVerse();
}

// Apply a resolved EventEngine effect object (already from EventEngine.generate)
function applyEventEffectResult(effect, cost){
  if (!effect) return 'Nothing happens.';
  let msg = effect.text || '...';

  if (effect.heal){
    healPlayer(effect.heal);
  }
  if (effect.gold){
    game.gold = Math.max(0, game.gold + effect.gold);
  }
  if (effect.shield){
    game.shield += effect.shield;
  }
  if (effect.buff){
    if (effect.buff === 'attack') game.attackBuff += (effect.buffMultiplier ? effect.buffMultiplier : 3);
    else if (effect.buff === 'defense') game.defenseBuff += 2;
    else if (effect.buff === 'wisdom' || effect.buff === 'fire'){
      // Temporary boost flagged for next verse multiplier
      game._tempBuff = game._tempBuff || {};
      game._tempBuff[effect.buff] = 0.5;
    }
  }
  if (effect.hpCost){
    game.hp = Math.max(1, game.hp - effect.hpCost);
  }
  if (effect.learnVerse){
    const v = getRandomVerse(game.floor);
    KnowledgeSystem.discoverVerse(v.id);
    game.discoveredCount = KnowledgeSystem.store.discoveredVerses.length;
    msg += '  Learned: "' + v.text + '" (' + v.reference + ')';
  }
  if (effect.revealWeakness){
    msg += '  (A demon\'s weakness is now known.)';
  }
  if (effect.revealAll || effect.revealTruth){
    msg += '  All weaknesses revealed.';
  }
  if (effect.revealMap || effect.revealMapNode){
    msg += '  The map reveals hidden paths.';
  }
  if (effect.invincible && combat){
    combat.invincibleTurns = (combat.invincibleTurns || 0) + effect.invincible;
  }
  if (effect.startCombat){
    activeEvent = null;
    const fake = { type: effect.multiEnemy ? NODE_TYPE.ELITE : NODE_TYPE.COMBAT };
    startCombat(fake);
    return null; // state changed to COMBAT
  }
  if (effect.permanentKnowledge){
    msg += '  (Recorded in your knowledge.)';
  }
  if (effect.storeHeal){
    game._storedHeal = (game._storedHeal || 0) + effect.storeHeal;
  }
  return msg;
}

function renderEvent(){
  const ev = activeEvent;
  rect(14, 14, W-28, H-36, C.stoneDark);
  strokeRect(14, 14, W-28, H-36, C.cyan);
  text(ev.title, W/2, 22, C.cyan, 8, 'center');
  const lines = wrapTextPx(ev.text, 340, 7);
  const blockH = lines.length * 12 + 10 + ev.choices.length * 20;
  let y = Math.max(38, Math.round((H - blockH) / 2) + 6);
  for (const l of lines){ text(l, 22, y, C.holy, 7, 'left'); y += 12; }
  y += 10;
  ev.choices.forEach((ch, i) => {
    button(24, y, W-48, 16, (i+1) + '. ' + ch.text, () => {
      const effect = ch.effect;
      // Authored map events carry an effect NAME that applyEventEffect resolves
      // and applies; EventEngine events arrive already resolved as an object.
      if (typeof effect === 'string'){
        const msg1 = applyEventEffect(effect, ch.cost);
        if (game.state === 'COMBAT') return;          // elite fight redirect
        activeEvent = null;
        game.rewardText = msg1 || '';
        game.state = 'TREASURE';
        return;
      }
      if (effect && effect.gold !== undefined && effect.gold < 0 && game.gold < -effect.gold){
        game.rewardText = 'Not enough gold.';
        return;
      }
      const msg = applyEventEffectResult(effect, 0);
      if (game.state === 'COMBAT') return; // startCombat redirect
      activeEvent = null;
      game.rewardText = msg || '';
      game.state = 'TREASURE';
    }, C.gold);
    y += 20;
  });
}

// ═══════════════════════════════════════════════════════════════
// LOOP
// ═══════════════════════════════════════════════════════════════
let lastT = performance.now();
function loop(now){
  // ponytail: one frame can never kill the game — an uncaught throw here used to
  // stop requestAnimationFrame forever, freezing the canvas on the last drawn frame.
  try { tick(now); } catch (e) {
    // Show it on screen — a silent stall is undiagnosable on someone else's device.
    if (window.__sfLastErr !== String(e && e.message)) {
      window.__sfLastErr = String(e && e.message);
      console.error('SEVEN FALLS frame error:', e);
    }
    try {
      ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, W, 20);
      ctx.fillStyle = '#ff6666'; ctx.font = '8px monospace'; ctx.textAlign = 'left';
      ctx.fillText('ERR: ' + String(e && e.message).slice(0, 52), 4, 13);
    } catch (_) {}
  }
  requestAnimationFrame(loop);
}
function tick(now){
  // ponytail: clamp dt — a long or NaN frame must not freeze/teleport animations
  const dt = Math.min(0.1, Math.max(0, (now - lastT) / 1000)) || 0.016;
  lastT = now;

  // combat timer
  if (game.state === 'COMBAT' && combat){
    // swarm mode countdown
    if (combat.isSwarm && CombatTwists.swarmMode){
      const s = CombatTwists.updateSwarm(dt);
      combat.swarmTimer = CombatTwists.swarmTimer;
      combat.swarmCount = CombatTwists.swarmCount;
      if (s && s.expired){
        combat.isSwarm = false;
        combat.twistTriggered.push('The swarm is broken!');
        CombatTwists.swarmMode = false;
      }
    }
    // Reading the Bible must not cost you the fight: the clock simply HOLDS while it
    // is open. It must be its own branch — falling through to the else below would run
    // the "timer disabled" path and count the clock UP instead of pausing it.
    if (game.timerEnabled && (game.bibleOpen || (combat && combat.screen && combat.screen !== 'FIGHT'))){
      /* paused: no drain, no count-up */
    } else if (game.timerEnabled){
      const prevTimer = combat.timer;
      combat.timer -= dt;
      // Easter egg: floor 7, timer crosses 7.77
      if (game.floor === 7 && prevTimer > 7.77 && combat.timer <= 7.77 && !combat._easterEgg777){
        combat._easterEgg777 = true;
        game._triggeredEasterEgg = true;
        combat.message = '7:77 — "I will open my mouth in parables"';
        combat.msgTimer = 2.5;
        healPlayer(7);
        game.gold += 77;
        if (typeof SFX !== 'undefined') SFX.play('buff');
        game.goldFlash = 1.0;
      }
      if (combat.timer <= 0){
        combat.message = 'TIME! The demon strikes!';
        combat.msgTimer = 1.2;
        combat.correctStreak = 0;
        combat.comboResult = null;
        combat.twistTriggered = [];
        combat.selected = [];
        demonAttack(true);
        if (game.hp <= 0){ die(); }
        else loadVerse();
      }
    } else {
      // timer disabled: count up as a 'suggested pace' readout, never auto-submits
      combat.timer += dt;
    }
    if (combat.msgTimer > 0) combat.msgTimer -= dt;
  // Verse word highlight timer
  if (game.verseHighlight >= 0) {
    game.verseHighlightTimer += dt;
    if (game.verseHighlightTimer > 3) { // highlight each word for 3 seconds
      game.verseHighlightTimer = 0;
      game.verseHighlight++;
      const vs = combat.verses || [];
      let maxIdx = 0;
      for (const v of vs) { const w = verseWords(v); if (w) maxIdx += w.length; }
      if (game.verseHighlight >= maxIdx) game.verseHighlight = -1; // done
    }
  }
  }
  // visual decays (run even outside combat so sparkles finish)
  if (game.flash > 0) game.flash = Math.max(0, game.flash - dt);
  if (game.goldFlash > 0) game.goldFlash = Math.max(0, game.goldFlash - dt * 1.2);
  if (game.comboAnim > 0) game.comboAnim = Math.max(0, game.comboAnim - dt);
  if (game.shakeTimer > 0) game.shakeTimer = Math.max(0, game.shakeTimer - dt);
  if (typeof MECH !== 'undefined') MECH.tickFlow(dt);
  if (typeof SpriteStates !== 'undefined') SpriteStates.update(dt);
  if (typeof Achievements !== 'undefined') Achievements.update(dt);
  if (typeof ScreenFX !== 'undefined') ScreenFX.update(dt);
  updateParticles(dt);
  // hint auto-dismiss
  if (game.activeHint){
    game.activeHint.timer -= dt;
    if (game.activeHint.timer <= 0) dismissHint();
  }

  render();
}

// INPUT
// ═══════════════════════════════════════════════════════════════
function toCanvas(e){
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W;
  const y = (e.clientY - r.top) / r.height * H;
  return { x, y };
}
canvas.addEventListener('pointermove', e => { pointer = toCanvas(e); });
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  // ponytail: a phone has no keyboard — the old keydown-only intro was a dead end on mobile.
  if (game.state === 'INTRO' && introStep < INTRO_LINES.length - 1){ introAdvance(); return; }
  const p = toCanvas(e);
  // The bible's controls are modal and share the bottom band with the transient hint
  // strip. The hint check below runs first and was swallowing these taps entirely, so
  // BACK TO FIGHT could not be pressed while a hint was up. Test the bible first.
  if (game.bibleOpen){
    if (p.y >= H - 56){
      const chips = (typeof bibleUseChips === 'function') ? bibleUseChips() : [];
      for (const c of chips){
        if (p.x >= c.x && p.x <= c.x + c.w && p.y >= c.y && p.y <= c.y + c.h){ useVerseInFight(c.i); return; }
      }
      const bx = W - 116;
      if (p.x >= bx && p.y >= H - 46){ game.bibleOpen = false; return; }
      return;
    }
  }
  // Click on the hint overlay dismisses it
  if (game.activeHint && pointIn(p.x, p.y, 6, H-32, W-12, 30)){ dismissHint(); return; }
  // Bible UI intercepts clicks when open (but only within its bounds)
  if (game.bibleOpen) {
    // The footer controls are drawn over the bible by the game, so they must be
    // tested BEFORE the panel's own hit regions or they can never be reached.
    if (p.y >= H - 40){
      const chips = (typeof bibleUseChips === 'function') ? bibleUseChips() : [];
      for (const c of chips){
        if (p.x >= c.x && p.x <= c.x + c.w && p.y >= c.y && p.y <= c.y + c.h){
          useVerseInFight(c.i);
          return;
        }
      }
      const bx = W - 116;
      if (p.x >= bx && p.y >= H - 36){ game.bibleOpen = false; return; }
      return;                                   // swallow the rest of the footer
    }
    // Bible panel bounds (matches renderBible drawing area)
    const bx = 10, by = 10, bw = W-20, bh = H-20;
    if (p.x >= bx && p.x <= bx+bw && p.y >= by && p.y <= by+bh) {
      const discIds = KnowledgeSystem.store.discoveredVerses || [];
      const result = handleBibleClick(p.x, p.y, discIds, game.biblePage, game.bibleScroll);
      if (result) {
        if (result.action === 'back') game.bibleOpen = false;
        else if (result.page) game.biblePage = result.page;
        if (result.scrollY !== undefined) game.bibleScroll = result.scrollY;
      }
      return; // consumed by bible
    }
    // Click OUTSIDE bible = close it
    game.bibleOpen = false;
    return;
  }
  // The vendetta roster is modal: any tap closes it.
  if (game.vendettaOpen){ game.vendettaOpen = false; return; }
  for (let i = clickables.length - 1; i >= 0; i--){
    const c = clickables[i];
    if (p.x >= c.x && p.x <= c.x + c.w && p.y >= c.y && p.y <= c.y + c.h){
      if (c.onClick) c.onClick();
      clickables = []; // ponytail: consume — a stale frame's array must not fire twice
      return;
    }
  }
});

window.addEventListener('keydown', e => {
  if (game.state === 'INTRO'){ introAdvance(); return; }
  if (game.state === 'COMBAT' && combat){
    if (e.key >= '1' && e.key <= '9'){
      const idx = parseInt(e.key, 10) - 1;
      if (idx < combat.pool.length) selectWord(idx);
    } else if (e.key === 'Enter'){
      submitVerse();
    } else if (e.key === 'b' || e.key === 'B') { game.bibleOpen = !game.bibleOpen; if (game.bibleOpen && !game.hintsShown['bible']) showHint('bible', 'Your Bible. Tap BACK TO FIGHT to return, or tap a verse to build it.', true); } else if (e.key === 'Escape' && game.bibleOpen) { game.bibleOpen = false; } else if (e.key === 'Backspace'){
      e.preventDefault();
      combat.selected.pop();
    } else if (e.key === ' '){
      e.preventDefault();
      clearSelection();
    }
  }
});

// ── QA hook ──────────────────────────────────────────────────────────────────
// Exposes internals for automated browser testing and design review.
// Strictly read-only handles — no game code reads from window.SF.
window.SF = {
  get state(){ return game.state; },
  get game(){ return game; },
  get map(){ return mapState ? mapState.map : null; },
  get combat(){ return combat; },
  get colors(){ return C; },
  get dims(){ return { W, H }; },
  nodePos, canMoveTo, nodeType: NODE_TYPE,
  // ── QA drivers ──────────────────────────────────────────────────────────────
  // These call the game's own entry points, so every screen they reach is the
  // real renderer with real state — nothing is faked for the screenshots.
  enterNode, die, winCombat, submitVerse, selectWord, clearSelection,
  // Drives the frame's own clickable list — the same handler a real tap hits,
  // so scripted runs press the same buttons a player does.
  clickFirst(){
    if (typeof clickables !== 'undefined' && clickables.length){
      const c = clickables[clickables.length - 1];
      if (c && c.onClick){ c.onClick(); return true; }
    }
    return false;
  },
  labels(){ return (typeof clickables !== 'undefined' ? clickables : []).map(c => c.label || ''); },
  jump(type){ enterNode({ type }); },
  solveCombat(){ if (combat) winCombat(); },
  reachable(){ const m = mapState && mapState.map; if(!m) return [];
    return m.nodes.filter(n => canMoveTo(n.id)).map(n => { const p = nodePos(n, m.totalRows); return { id:n.id, type:n.type, x:p.x, y:p.y }; }); },
  allNodes(){ const m = mapState && mapState.map; if(!m) return [];
    return m.nodes.map(n => { const p = nodePos(n, m.totalRows); return { id:n.id, type:n.type, x:p.x, y:p.y, visited:m.visited.has(n.id) }; }); }
};

// Boot after the pixel font is ready so the first frame is laid out with the
// real metrics (canvas fillText never waits for a font on its own).
if (document.fonts && document.fonts.load){
  Promise.race([
    document.fonts.load('8px "Press Start 2P"').catch(() => {}),
    new Promise(r => setTimeout(r, 1500)),
  ]).then(() => requestAnimationFrame(loop));
} else {
  requestAnimationFrame(loop);
}
</script>
