<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SEVEN FALLS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; font-family: 'Press Start 2P', monospace; touch-action: none; }
canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
#game { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
#scanlines { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 100; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px); }
#crt-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 99; background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.4) 100%); }
</style>
</head>
<body>
<div id="game"><canvas id="canvas"></canvas></div>
<div id="scanlines"></div>
<div id="crt-overlay"></div>

<script src="src/verses.js"></script>
<script src="src/demons.js"></script>
<script src="src/knowledge.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
// SEVEN FALLS — Knowledge-Driven Roguelike
// Knowledge IS the progression. Dying is how you learn.
// ═══════════════════════════════════════════════════════════════

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// ── GameBlocks Seeded PRNG ──────────────────────────────────
class RandomGenerator {
  constructor(seed = 42) { this.seed(seed); }
  seed(seed = 42) { this.state = seed >>> 0; return this; }
  random() {
    this.state += 0x6d2b79f5;
    let t = Math.imul(this.state ^ (this.state >>> 15), 1 | this.state);
    t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  uniform(min, max) { return min + (max - min) * this.random(); }
  randint(min, max) { return Math.floor(this.uniform(min, max + 1)); }
  choice(items) { return items[Math.floor(this.random() * items.length)]; }
  shuffle(arr) {
    const a = [...arr]; for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(this.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]];
    } return a;
  }
}
const RNG = new RandomGenerator(Date.now());

// ── CONSTANTS ───────────────────────────────────────────────
const SCALE = 3;
const W = 256, H = 192;
canvas.width = W * SCALE; canvas.height = H * SCALE;
canvas.style.width = (W * SCALE) + 'px'; canvas.style.height = (H * SCALE) + 'px';
ctx.imageSmoothingEnabled = false;

const C = {
  bg:'#0a0a1a',bgLight:'#12122a',stone:'#2a2a3a',stoneLight:'#3a3a4a',stoneDark:'#1a1a2a',
  gold:'#ffd700',goldDark:'#b8960f',blood:'#8b0000',bloodBright:'#cc0000',
  holy:'#e8e0ff',holyDim:'#a090cc',white:'#f0f0f0',black:'#000000',
  green:'#00aa44',greenDark:'#006622',red:'#cc3333',redDark:'#882222',
  blue:'#3344aa',blueDark:'#222266',purple:'#7733aa',purpleDark:'#442266',
  cyan:'#33aaaa',textMain:'#e8e0ff',textDim:'#8877aa',textGold:'#ffd700',
  textRed:'#ff4444',textGreen:'#44ff88',uiBg:'#0e0e1e',uiBorder:'#3a3a5a',uiHighlight:'#5555aa',
};

// ── INPUT ───────────────────────────────────────────────────
const keys = {}; let mouseX = 0, mouseY = 0, mouseClicked = false, clickedX = 0, clickedY = 0;
document.addEventListener('keydown', e => { keys[e.code] = true; keys[e.key] = true; });
document.addEventListener('keyup', e => { keys[e.code] = false; keys[e.key] = false; });
canvas.addEventListener('click', e => { const r = canvas.getBoundingClientRect(); mouseX = (e.clientX-r.left)/SCALE; mouseY = (e.clientY-r.top)/SCALE; mouseClicked = true; clickedX = mouseX; clickedY = mouseY; });
canvas.addEventListener('mousemove', e => { const r = canvas.getBoundingClientRect(); mouseX = (e.clientX-r.left)/SCALE; mouseY = (e.clientY-r.top)/SCALE; });
canvas.addEventListener('touchstart', e => { e.preventDefault(); const t = e.touches[0], r = canvas.getBoundingClientRect(); mouseX = (t.clientX-r.left)/SCALE; mouseY = (t.clientY-r.top)/SCALE; mouseClicked = true; clickedX = mouseX; clickedY = mouseY; });
canvas.addEventListener('touchmove', e => { e.preventDefault(); const t = e.touches[0], r = canvas.getBoundingClientRect(); mouseX = (t.clientX-r.left)/SCALE; mouseY = (t.clientY-r.top)/SCALE; });

// ── DRAWING ─────────────────────────────────────────────────
function clear() { ctx.fillStyle = C.bg; ctx.fillRect(0,0,W,H); }
function drawText(text,x,y,color=C.textMain,size=1,align='left') {
  ctx.font = `${8*size}px 'Press Start 2P'`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'top'; ctx.fillText(text,x,y);
}
function drawTextShadow(text,x,y,color=C.textMain,shadow=C.black,size=1,align='left') {
  ctx.font = `${8*size}px 'Press Start 2P'`; ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.fillStyle = shadow; ctx.fillText(text,x+1,y+1); ctx.fillStyle = color; ctx.fillText(text,x,y);
}
function drawRect(x,y,w,h,color) { ctx.fillStyle = color; ctx.fillRect(Math.floor(x),Math.floor(y),Math.floor(w),Math.floor(h)); }
function drawBorder(x,y,w,h,color=C.uiBorder,t=1) { ctx.strokeStyle=color; ctx.lineWidth=t; ctx.strokeRect(Math.floor(x)+.5,Math.floor(y)+.5,Math.floor(w)-1,Math.floor(h)-1); }
function drawBox(x,y,w,h,bg=C.uiBg,bc=C.uiBorder) { drawRect(x,y,w,h,bg); drawBorder(x,y,w,h,bc); }
function drawHPBar(x,y,w,h,cur,max,barColor=C.red,bg='#1a0000') { drawRect(x,y,w,h,bg); drawRect(x,y,Math.floor(w*Math.max(0,cur/max)),h,barColor); drawBorder(x,y,w,h,C.uiBorder); }

// ── GAME STATES ─────────────────────────────────────────────
const ST = { TITLE:'title', INTRO:'intro', EXPLORE:'explore', COMBAT:'combat', COMBAT_WIN:'combat_win',
  DEATH:'death', FLOOR_TRANS:'floor_trans', VICTORY:'victory', BESTIARY:'bestiary', SCROLL:'scroll', SCHOLAR:'scholar' };

const game = {
  state: ST.TITLE, floor: 1, maxFloor: 10,
  player: { hp:30, maxHp:30, attack:5, defense:0, gold:0, xp:0, level:1,
    versesInCombat: [], shieldActive:false, buffTurns:0, armorBonus:0 },
  dungeon: { rooms:[], currentRoom:0, roomsPerFloor:8, playerPos:{x:1,y:1} },
  combat: { demon:null, verse:null, pool:[], selected:[], timer:45, timerMax:45, timerActive:false,
    messages:[], playerTurn:true, turnCount:0, demonStruck:false, playerStruck:false,
    strikeTimer:0, shakeTimer:0, shakeIntensity:0, lastVerseType:null, correctCount:0 },
  death: { deathCount:0, quoteRevealed:0, quoteText:'A just man falleth seven times, but the Lord upholdeth him with his righteous right hand', timer:0, insight:'' },
  transition: { timer:0, text:'' },
  intro: { step:0, timer:0 },
  scroll: { verseId:null, timer:0 },
  scholar: { note:null, timer:0 },
  anim: { frame:0, titlePulse:0, sparkle:0, floorGlow:0 },
  _consumedClick: false,
};

function consumeClick() { if (game._consumedClick) return false; if (mouseClicked) { game._consumedClick = true; return true; } return false; }
function resetFrame() { mouseClicked = false; game._consumedClick = false; }

// ── GAME FLOW ───────────────────────────────────────────────
function startNewGame() {
  game.floor = 1;
  game.player.hp = 30; game.player.maxHp = 30; game.player.attack = 5;
  game.player.defense = 0; game.player.gold = 0; game.player.xp = 0; game.player.level = 1;
  game.player.shieldActive = false; game.player.buffTurns = 0; game.player.armorBonus = 0;
  game.combat.messages = []; game.death.deathCount = 0;
  
  // Knowledge system — start a new run
  KnowledgeSystem.startRun();
  
  // First time? Show intro
  if (KnowledgeSystem.store.totalRuns <= 1) {
    game.state = ST.INTRO;
    game.intro.step = 0; game.intro.timer = 0;
  } else {
    game.state = ST.EXPLORE;
    generateDungeon();
  }
}

function startRun() {
  KnowledgeSystem.startRun();
  generateDungeon();
  game.state = ST.EXPLORE;
}

// ── INTRO SEQUENCE (first run only) ─────────────────────────
function updateIntro(dt) {
  game.intro.timer += dt;
  if (consumeClick() || keys['Enter'] || keys[' ']) {
    keys['Enter'] = false; keys[' '] = false;
    game.intro.step++;
    game.intro.timer = 0;
    if (game.intro.step >= 4) {
      generateDungeon();
      game.state = ST.EXPLORE;
    }
  }
}

function drawIntro() {
  clear();
  const steps = [
    { text: 'You stand at the mouth of the abyss.', sub: 'Demons guard every floor below.' },
    { text: 'You carry no sword.', sub: 'Your weapon is the Word.' },
    { text: 'Chain Bible verses from scattered words.', sub: 'Each verse is a blow against the darkness.' },
    { text: 'You will fall.', sub: 'But every fall teaches you something.' },
  ];
  const s = steps[Math.min(game.intro.step, steps.length-1)];
  
  const fade = Math.min(1, game.intro.timer * 2);
  ctx.globalAlpha = fade;
  drawTextShadow(s.text, W/2, H/2-20, C.holy, C.black, 0.7, 'center');
  drawTextShadow(s.sub, W/2, H/2+5, C.textDim, C.black, 0.5, 'center');
  if (game.intro.timer > 1.5) {
    drawText('CLICK TO CONTINUE', W/2, H/2+35, C.textDim, 0.4, 'center');
  }
  ctx.globalAlpha = 1;
}

// ── DUNGEON GENERATOR ───────────────────────────────────────
const MAP_W = 32, MAP_H = 24;

function generateDungeon() {
  const rooms = [];
  const numRooms = game.dungeon.roomsPerFloor + game.floor;
  
  for (let i = 0; i < numRooms; i++) {
    const room = { type:'empty', cleared:false, demon:null, noteFound:false };
    const roll = RNG.random();
    if (i === 0) room.type = 'start';
    else if (i === numRooms - 1) room.type = 'exit';
    else if (roll < 0.45) room.type = 'enemy';
    else if (roll < 0.58) room.type = 'treasure';
    else if (roll < 0.68) room.type = 'shrine';
    else if (roll < 0.78) room.type = 'scholar';
    else room.type = 'empty';
    
    // Pre-assign demon to enemy rooms
    if (room.type === 'enemy') {
      room.demon = getDemonForFloor(game.floor);
    }
    
    rooms.push(room);
  }
  // Ensure at least 2 enemy rooms per floor
  let enemyCount = rooms.filter(r => r.type === 'enemy').length;
  while (enemyCount < 2) {
    const idx = RNG.randint(1, numRooms - 2);
    if (rooms[idx].type === 'empty') {
      rooms[idx].type = 'enemy';
      rooms[idx].demon = getDemonForFloor(game.floor);
      enemyCount++;
    }
  }
  
  game.dungeon.rooms = rooms;
  game.dungeon.currentRoom = 0;
  game.dungeon.playerPos = { x:1, y:1 };
}

function nextRoom() {
  game.dungeon.currentRoom++;
  if (game.dungeon.currentRoom >= game.dungeon.rooms.length) {
    if (game.floor >= game.maxFloor) { game.state = ST.VICTORY; KnowledgeSystem.endRun(game.floor, true); }
    else { game.state = ST.FLOOR_TRANS; game.transition.timer = 3; game.transition.text = `Floor ${game.floor} Purged`; }
    return;
  }
  game.dungeon.playerPos = { x:1, y:1 };
}

// ── EXPLORE MODE ────────────────────────────────────────────
function updateExplore(dt) {
  const p = game.dungeon.playerPos;
  const speed = 80 * dt;
  if (keys['ArrowLeft']||keys['a']||keys['A']) p.x = Math.max(1, p.x - speed*0.06);
  if (keys['ArrowRight']||keys['d']||keys['D']) p.x = Math.min(MAP_W-2, p.x + speed*0.06);
  if (keys['ArrowUp']||keys['w']||keys['W']) p.y = Math.max(1, p.y - speed*0.06);
  if (keys['ArrowDown']||keys['s']||keys['S']) p.y = Math.min(MAP_H-2, p.y + speed*0.06);
  
  const room = game.dungeon.rooms[game.dungeon.currentRoom];
  const cx = MAP_W/2, cy = MAP_H/2;
  
  // Near enemy → combat
  if (room.type === 'enemy' && !room.cleared) {
    if (Math.abs(p.x-cx) < 3 && Math.abs(p.y-cy) < 3) {
      startCombat(room.demon);
      return;
    }
  }
  
  // Near exit → next room
  if (room.type === 'exit' || (room.type === 'start' && game.dungeon.currentRoom === 0)) {
    if (Math.abs(p.x-(MAP_W-3)) < 2 && Math.abs(p.y-(MAP_H-3)) < 2) { nextRoom(); return; }
  }
  
  // Near treasure
  if (room.type === 'treasure' && !room.cleared) {
    if (Math.abs(p.x-cx) < 2 && Math.abs(p.y-cy) < 2) {
      room.cleared = true;
      const gold = 8 + Math.floor(RNG.random() * 12);
      game.player.gold += gold;
      addMsg(`Found ${gold} gold`, C.textGold);
      // Chance to find a scroll fragment
      if (RNG.random() < 0.5) {
        const undiscovered = VERSES.filter(v => !KnowledgeSystem.isVerseDiscovered(v.id) && v.difficulty <= 2);
        if (undiscovered.length > 0) {
          const verse = RNG.choice(undiscovered);
          const result = KnowledgeSystem.addScrollFragment(verse.id);
          if (result.discovered) {
            addMsg(`Scroll complete! Learned: "${verse.text}"`, C.textGold);
          } else {
            addMsg(`Found scroll fragment (${result.fragments}/${verse.difficulty})`, C.textDim);
          }
        }
      }
    }
  }
  
  // Near shrine
  if (room.type === 'shrine' && !room.cleared) {
    if (Math.abs(p.x-cx) < 2 && Math.abs(p.y-cy) < 2) {
      room.cleared = true;
      const heal = Math.floor(game.player.maxHp * 0.35);
      game.player.hp = Math.min(game.player.maxHp, game.player.hp + heal);
      addMsg(`Healed ${heal} HP`, C.textGreen);
      // Shrine teaches a verse
      if (RNG.random() < 0.6) {
        const undiscovered = VERSES.filter(v => !KnowledgeSystem.isVerseDiscovered(v.id));
        if (undiscovered.length > 0) {
          const verse = RNG.choice(undiscovered);
          KnowledgeSystem.discoverVerse(verse.id);
          addMsg(`The shrine teaches: "${verse.text}"`, C.textGold);
        }
      }
    }
  }
  
  // Near scholar
  if (room.type === 'scholar' && !room.noteFound) {
    if (Math.abs(p.x-cx) < 2 && Math.abs(p.y-cy) < 2) {
      room.noteFound = true;
      const note = getScholarNoteForFloor(game.floor);
      if (note) {
        KnowledgeSystem.addScholarNote(note);
        game.state = ST.SCHOLAR;
        game.scholar.note = note;
        game.scholar.timer = 0;
      }
    }
  }
}

// ── COMBAT ──────────────────────────────────────────────────
function startCombat(demon) {
  game.state = ST.COMBAT;
  game.combat.demon = { ...demon };
  
  // Record observation
  KnowledgeSystem.observeDemon(demon.type);
  
  // Pick a verse the player KNOWS for this combat
  const known = KnowledgeSystem.getAvailableVerses();
  if (known.length === 0) {
    // No verses known — show a desperate message
    addMsg('You know no verses! Find scrolls or shrines to learn.', C.textRed);
    // Give them one free basic verse so the game isn't literally unplayable
    KnowledgeSystem.discoverVerse('ps23_1');
    known.push('ps23_1');
  }
  
  // Pick a verse the player knows, weighted by what might work
  const verse = pickBestVerse(known, demon.type);
  game.combat.verse = verse;
  game.combat.pool = getCombatPool(verse, game.floor);
  game.combat.selected = [];
  game.combat.timer = Math.max(25, 45 - game.floor * 2);
  game.combat.timerMax = game.combat.timer;
  game.combat.timerActive = true;
  game.combat.playerTurn = true;
  game.combat.turnCount = 0;
  game.combat.demonStruck = false;
  game.combat.playerStruck = false;
  game.combat.lastVerseType = null;
  game.combat.correctCount = 0;
  
  addMsg(`${demon.name} blocks your path!`, C.textRed);
}

function pickBestVerse(knownVerseIds, demonType) {
  // If we know the weakness, try to pick a verse of that type
  const bestiary = KnowledgeSystem.getBestiaryEntry(demonType);
  if (bestiary && bestiary.weakTo) {
    const strong = VERSES.filter(v => knownVerseIds.includes(v.id) && v.type === bestiary.weakTo);
    if (strong.length > 0) return RNG.choice(strong);
  }
  
  // Otherwise, pick a random known verse
  const available = VERSES.filter(v => knownVerseIds.includes(v.id));
  if (available.length > 0) return RNG.choice(available);
  
  // Fallback (shouldn't happen)
  return VERSES[0];
}

function updateCombat(dt) {
  const c = game.combat;
  
  if (c.timerActive && c.timer > 0) {
    c.timer -= dt;
    if (c.timer <= 0) { c.timer = 0; demonAttack(); }
  }
  if (c.strikeTimer > 0) c.strikeTimer -= dt;
  if (c.shakeTimer > 0) c.shakeTimer -= dt;
  
  game.combat.messages.forEach(m => m.timer -= dt);
  game.combat.messages = game.combat.messages.filter(m => m.timer > 0);
  
  if (!c.playerTurn) return;
  
  if (consumeClick()) handleWordClick(clickedX, clickedY);
  
  for (let i = 0; i < Math.min(c.pool.length, 10); i++) {
    const key = i === 9 ? '0' : String(i+1);
    if (keys[key]) { keys[key] = false; toggleWord(i); }
  }
  if (keys['Enter']||keys['Space']) { keys['Enter']=false; keys['Space']=false; submitVerse(); }
  if (keys['Backspace']) { keys['Backspace']=false; c.selected = []; }
}

function handleWordClick(mx, my) {
  const c = game.combat;
  const bubbleW=38, bubbleH=14, gap=3, cols=Math.min(5,c.pool.length);
  const totalW = cols*(bubbleW+gap)-gap, startX=(W-totalW)/2, startY=110;
  
  for (let i = 0; i < c.pool.length; i++) {
    const col=i%cols, row=Math.floor(i/cols);
    const bx=startX+col*(bubbleW+gap), by=startY+row*(bubbleH+gap);
    if (mx>=bx && mx<=bx+bubbleW && my>=by && my<=by+bubbleH) { toggleWord(i); return; }
  }
  // Submit button
  const sx=W/2-30, sy=170;
  if (mx>=sx && mx<=sx+60 && my>=sy && my<=sy+14) submitVerse();
}

function toggleWord(i) {
  const c = game.combat, word = c.pool[i];
  const idx = c.selected.indexOf(word);
  if (idx >= 0) c.selected.splice(idx, 1); else c.selected.push(word);
}

function submitVerse() {
  const c = game.combat;
  if (c.selected.length === 0) return;
  c.timerActive = false; c.playerTurn = false;
  
  const correct = checkVerse(c.selected, c.verse);
  c.lastVerseType = c.verse.type;
  
  if (correct) {
    c.correctCount++;
    let damage = c.verse.damage;
    const mult = getDamageMultiplier(c.demon.type, c.verse.type);
    damage = Math.floor(damage * mult);
    if (game.player.buffTurns > 0) damage = Math.floor(damage * 1.5);
    damage = Math.max(1, damage - game.player.defense);
    
    c.demon.hp -= damage;
    c.demonStruck = true; c.strikeTimer = 0.5; c.shakeTimer = 0.3; c.shakeIntensity = 4;
    
    const typeNames = {praise:'Praise',wisdom:'Wisdom',warfare:'Warfare',fire:'Fire',mercy:'Mercy'};
    if (mult >= 2) addMsg(`${damage} ${typeNames[c.verse.type]}! SUPER EFFECTIVE!`, C.textGold);
    else if (mult > 1) addMsg(`${damage} ${typeNames[c.verse.type]}! Effective!`, C.textGreen);
    else addMsg(`${damage} ${typeNames[c.verse.type]} damage`, C.textMain);
    
    // Effects
    applyVerseEffect(c.verse);
    
    if (c.demon.hp <= 0) { c.demon.hp = 0; setTimeout(()=>combatWin(), 1000); return; }
  } else {
    addMsg('The words scatter into the air...', C.textDim);
    c.shakeTimer = 0.2; c.shakeIntensity = 2;
  }
  
  setTimeout(()=>demonAttack(), 1500);
}

function applyVerseEffect(verse) {
  const effects = {
    heal_5: ()=>{ game.player.hp=Math.min(game.player.maxHp,game.player.hp+5); addMsg('+5 HP',C.textGreen); },
    heal_10: ()=>{ game.player.hp=Math.min(game.player.maxHp,game.player.hp+10); addMsg('+10 HP',C.textGreen); },
    heal_15: ()=>{ game.player.hp=Math.min(game.player.maxHp,game.player.hp+15); addMsg('+15 HP',C.textGreen); },
    shield: ()=>{ game.player.shieldActive=true; addMsg('Shield active!',C.cyan); },
    buff: ()=>{ game.player.buffTurns=3; addMsg('Attack buffed!',C.textGold); },
    armor: ()=>{ game.player.armorBonus=3; addMsg('+3 Armor!',C.blue); },
    stun: ()=>{ addMsg('Demon stunned!',C.purple); },
    judgment: ()=>{ const b=Math.floor(game.combat.demon.hp*0.15); game.combat.demon.hp-=b; addMsg(`Judgment! +${b}!`,C.textGold); },
    revive: ()=>{ if(game.player.hp<game.player.maxHp*0.3){game.player.hp=Math.floor(game.player.maxHp*0.5);addMsg('Risen again!',C.textGreen);} },
    debuff: ()=>{ addMsg('Demon weakened!',C.purple); },
    reveal_weakness: ()=>{ addMsg(`Weakness: ${game.combat.demon.type}`,C.textDim); },
    smite: ()=>{},
  };
  if (effects[verse.effect]) effects[verse.effect]();
}

function demonAttack(stunned=false) {
  const c = game.combat;
  if (stunned) { addMsg('Demon is stunned!',C.purple); playerTurnStart(); return; }
  
  c.playerStruck = true; c.strikeTimer = 0.5; c.shakeTimer = 0.3; c.shakeIntensity = 3;
  
  let dmg = Math.floor(5 + game.floor*2 + RNG.random()*8);
  if (game.player.shieldActive) { dmg = Math.floor(dmg*0.5); game.player.shieldActive=false; addMsg('Shield absorbed!',C.cyan); }
  dmg = Math.max(1, dmg - game.player.defense - game.player.armorBonus);
  
  game.player.hp -= dmg;
  addMsg(`${c.demon.name} strikes! -${dmg} HP`, C.textRed);
  
  if (game.player.buffTurns > 0) game.player.buffTurns--;
  if (game.player.armorBonus > 0) game.player.armorBonus = Math.max(0, game.player.armorBonus-1);
  
  if (game.player.hp <= 0) { game.player.hp = 0; setTimeout(()=>startDeath(), 1000); return; }
  setTimeout(()=>playerTurnStart(), 1500);
}

function playerTurnStart() {
  const c = game.combat;
  c.turnCount++; c.playerTurn = true; c.demonStruck = false; c.playerStruck = false;
  
  const known = KnowledgeSystem.getAvailableVerses();
  if (known.length === 0) { KnowledgeSystem.discoverVerse('ps23_1'); known.push('ps23_1'); }
  const verse = pickBestVerse(known, c.demon.type);
  c.verse = verse;
  c.pool = getCombatPool(verse, game.floor);
  c.selected = [];
  c.timer = Math.max(20, 40 - game.floor*2);
  c.timerMax = c.timer; c.timerActive = true;
}

function combatWin() {
  game.state = ST.COMBAT_WIN;
  const d = game.combat.demon;
  game.player.gold += d.gold; game.player.xp += d.xp;
  
  const xpNeeded = game.player.level * 30;
  if (game.player.xp >= xpNeeded) {
    game.player.level++; game.player.xp -= xpNeeded;
    game.player.maxHp += 8; game.player.hp = game.player.maxHp;
    game.player.attack += 2; game.player.defense += 1;
    addMsg(`LEVEL UP! Level ${game.player.level}`, C.textGold);
  }
  
  game.dungeon.rooms[game.dungeon.currentRoom].cleared = true;
  KnowledgeSystem.slayDemon(d.type);
  
  // First kill of this type → teach something
  const entry = KnowledgeSystem.getBestiaryEntry(d.type);
  if (entry && entry.killed === 1) {
    const weak = WEAKNESS_MAP[d.type];
    if (weak) {
      const names = {praise:'Praise',wisdom:'Wisdom',warfare:'Warfare',fire:'Fire',mercy:'Mercy'};
      addMsg(`DEMONOLOGY: ${d.name} is weak to ${names[weak.best]} verses!`, C.textGold);
    }
  }
}

// ── DEATH ───────────────────────────────────────────────────
function startDeath() {
  game.state = ST.DEATH;
  game.death.deathCount++;
  game.death.quoteRevealed = 0;
  game.death.timer = 0;
  
  // Generate insight based on what happened
  const d = game.combat.demon;
  const v = game.combat.lastVerseType;
  game.death.insight = KnowledgeSystem.getDeathInsight(d.type, v);
  KnowledgeSystem.recordDeathInsight(game.death.insight);
  KnowledgeSystem.endRun(game.floor, false);
}

function updateDeath(dt) {
  game.death.timer += dt;
  if (game.death.quoteRevealed < game.death.quoteText.length) {
    game.death.quoteRevealed += dt * 25;
  }
  if (game.death.quoteRevealed >= game.death.quoteText.length && game.death.timer > 4) {
    if (consumeClick() || keys['Enter'] || keys[' ']) {
      keys['Enter']=false; keys[' ']=false;
      game.state = ST.EXPLORE;
      generateDungeon();
      // Restore HP for new run (slightly less each time to increase difficulty)
      const maxHp = Math.max(20, 30 - game.death.deathCount * 2);
      game.player.hp = maxHp; game.player.maxHp = maxHp;
      game.player.shieldActive = false; game.player.buffTurns = 0; game.player.armorBonus = 0;
      addMsg('You rise again...', C.holy);
    }
  }
}

function drawDeath() {
  clear();
  const fade = Math.min(1, game.death.timer * 0.5);
  drawRect(0, 0, W, H, `rgba(10,10,10,${fade})`);
  if (game.death.timer < 1) return;
  
  // Proverbs 24:16 letter by letter
  const vis = Math.floor(game.death.quoteRevealed);
  const text = game.death.quoteText.slice(0, vis);
  ctx.font = "6px 'Press Start 2P'";
  const words = text.split(' ');
  const lines = []; let cur = '';
  for (const w of words) {
    const test = cur ? cur+' '+w : w;
    if (ctx.measureText(test).width > 200) { lines.push(cur); cur = w; } else cur = test;
  }
  if (cur) lines.push(cur);
  
  const lh = 12, sy = H/2 - lines.length*lh/2;
  for (let i = 0; i < lines.length; i++)
    drawTextShadow(lines[i], W/2, sy+i*lh, C.holy, C.black, 0.5, 'center');
  
  if (vis >= game.death.quoteText.length) {
    drawText('— Proverbs 24:16', W/2, sy+lines.length*lh+10, C.textGold, 0.45, 'center');
    
    // Insight
    if (game.death.insight) {
      drawTextShadow(game.death.insight, W/2, H/2+40, C.textDim, C.black, 0.4, 'center');
    }
    
    // Stats
    const stats = KnowledgeSystem.getRunStats();
    drawText(`Run #${stats.runs} | Best Floor: ${stats.bestFloor} | Verses: ${stats.versesKnown}/${VERSES.length}`, W/2, H-35, C.textDim, 0.35, 'center');
    
    if (Math.floor(game.death.timer*2)%2===0)
      drawText('CLICK TO RISE AGAIN', W/2, H-20, C.textMain, 0.45, 'center');
  }
}

// ── FLOOR TRANSITION ────────────────────────────────────────
function updateTransition(dt) {
  game.transition.timer -= dt;

    game.floor++;
    generateDungeon();
    game.state = ST.EXPLORE;
  }
}

  const alpha = t > 1.5 ? (3-t*2) : (t*2);

  drawTextShadow(game.transition.text, W/2, H/2-10, C.textGold, C.black, 1.2, 'center');
  drawTextShadow(`Entering Floor ${game.floor+1}`, W/2, H/2+10, C.textDim, C.black, 0.5, 'center');

}

// ── EXPLORE RENDER ──────────────────────────────────────────
function drawDungeonFloor() {
  for (let y=0;y<MAP_H;y++) for (let x=0;x<MAP_W;x++) {
    const isEdge=x===0||y===0||x===MAP_W-1||y===MAP_H-1;
    const col=isEdge?C.stoneDark:(RNG.random()>0.9?C.stoneLight:C.stone);
    drawRect(x*(W/MAP_W),y*(H/MAP_H),W/MAP_W+1,H/MAP_H+1,col);
  }
  // Stone texture
  for (let i=0;i<15;i++) {
    const x=Math.floor(RNG.random()*MAP_W), y=Math.floor(RNG.random()*MAP_H);
    drawRect(x*(W/MAP_W),y*(H/MAP_H),3,3,C.stoneDark);
  }
}

  const room = game.dungeon.rooms[game.dungeon.currentRoom];
  const cx = (W/MAP_W)*(MAP_W/2), cy = (H/MAP_H)*(MAP_H/2);
  
  if (room.type === 'enemy' && !room.cleared) {

function drawMessages() {
  const msgs = game.combat.messages.filter(m=>m.timer>0);
  for (let i=0;i<msgs.length;i++) {

  drawText('SUBMIT',subX+30,subY+3,canSub?C.textGold:C.textDim,0.4,'center');
  
  // Timer
  const tW2=100,tX=W/2-tW2/2,tY=H-20;
  drawBox(tX-2,tY-2,tW2+4,12);
  const pct=c.timer/c.timerMax;
  drawRect(tX,tY,Math.floor(tW2*pct),8,pct>0.5?C.green:pct>0.25?C.gold:C.red);
  drawText(`${Math.ceil(c.timer)}s`,W/2,tY,C.white,0.4,'center');
  
  drawMessages();
  ctx.restore();
}

function drawCombatWin() {
  drawCombat();
  drawRect(0,0,W,H,'rgba(0,0,0,0.6)');
  const d=game.combat.demon;
  drawTextShadow('DEFEATED',W/2,60,C.textGold,C.black,1.5,'center');
  drawTextShadow(d.name,W/2,80,C.textRed,C.black,0.7,'center');
  drawText(`+${d.xp} XP  |  +${d.gold} Gold`,W/2,100,C.textGold,0.5,'center');
  
  const entry=KnowledgeSystem.getBestiaryEntry(d.type);
  if (entry&&entry.killed===1) {
    const weakNames={praise:'Praise',wisdom:'Wisdom',warfare:'Warfare',fire:'Fire',mercy:'Mercy'};
    drawTextShadow(`Weakness learned: ${weakNames[entry.weakTo]}`,W/2,120,C.textGreen,C.black,0.45,'center');
  }
  
  if (Math.floor(game.anim.frame*0.05)%2===0) drawText('CLICK TO CONTINUE',W/2,140,C.textMain,0.45,'center');
}

// ── MAIN LOOP ───────────────────────────────────────────────
let lastTime = performance.now();
function gameLoop(ts) {
  const dt = Math.min((ts-lastTime)/1000, 0.1);
  lastTime = ts; game.anim.frame++;
  
  switch(game.state) {
    case ST.TITLE: updateTitle(dt); break;
    case ST.INTRO: updateIntro(dt); break;
    case ST.EXPLORE: updateExplore(dt); break;
    case ST.COMBAT: updateCombat(dt); break;
    case ST.COMBAT_WIN: game.combat.messages.forEach(m=>m.timer-=dt); game.combat.messages=game.combat.messages.filter(m=>m.timer>0); if(consumeClick()||keys['Enter']||keys[' ']){keys['Enter']=false;keys[' ']=false;game.state=ST.EXPLORE;} break;
    case ST.DEATH: updateDeath(dt); break;
    case ST.FLOOR_TRANS: updateTransition(dt); break;
    case ST.VICTORY: updateVictory(dt); break;
    case ST.SCHOLAR: updateScholar(dt); break;
    case ST.SCROLL: updateScroll(dt); break;
  }
  
  switch(game.state) {
    case ST.TITLE: drawTitle(); break;
    case ST.INTRO: drawIntro(); break;
    case ST.EXPLORE: drawExplore(); break;
    case ST.COMBAT: drawCombat(); break;
    case ST.COMBAT_WIN: drawCombatWin(); break;
    case ST.DEATH: drawDeath(); break;
    case ST.FLOOR_TRANS: drawTransition(); break;
    case ST.VICTORY: drawVictory(); break;
    case ST.SCHOLAR: drawScholar(); break;
    case ST.SCROLL: drawScroll(); break;
  }
  
  resetFrame();
  requestAnimationFrame(gameLoop);
}

// ── INIT ────────────────────────────────────────────────────
KnowledgeSystem.load();
requestAnimationFrame(gameLoop);
</script>
