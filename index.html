// ── Color palette ────────────────────────────────────────────

const C = {

// ── Fill gaps the source files expect but do not define ──────
// WEAKNESS_MAP[demonType] -> { best, good }  (verse-type keys)
const WEAKNESS_MAP = (function(){
  const m = {};
  DEMONS.forEach(d => {
    const key = d.type || d.territory || d.fallenCategory || ('x_'+d.id);
    if (!m[key] && d.weakTo && d.weakTo !== 'all_verse_types') {

    }

})();
// DEMON_TYPES is only used by KnowledgeSystem.getRunStats() for a count
const DEMON_TYPES = SIN_TYPE;

// ── Verse data normalisation ─────────────────────────────────
// BIBLE_VERSES ships `verseType` (and 580 entries with damage 0), but the whole
// combat system reads `verse.type` and `verse.damage`. With type undefined, the
// weakness multiplier, fatigue, immunity, synergy, combos, tile colours and the
// damage message all silently degraded — every hit read "undefined <ref> -1".
// Normalise once, here, so every consumer downstream sees one shape.
(function normaliseVerseData(){
  const src = (typeof BIBLE_VERSES !== 'undefined' && BIBLE_VERSES) ? BIBLE_VERSES : null;
  if (!src) return;
  for (const v of src){
    if (!v.type && v.verseType) v.type = v.verseType;
    // Verses with no usable damage made combat an ~15-turn grind at 1 dmg/hit.
    // Derive a modest value from difficulty so every verse can actually hurt.
    if (!v.damage || v.damage <= 0){
      const d = v.difficulty || 1;
      v.damage = 6 + d * 2;
    }

  if (typeof globalThis.typeNames === 'undefined'){

// the real `const MECH` from mechanics.js.

// ── Seeded PRNG (deterministic runs) ────────────────────────
class RandomGenerator {
  constructor(seed){ this.seed = (seed>>>0) || 1; this.state = this.seed; }
  random(){
    let x = this.state;
    x ^= x << 13; x >>>= 0;
    x ^= x >> 17;
    x ^= x << 5;  x >>>= 0;
    this.state = x >>> 0;
    return this.state / 4294967296;
  }
  choice(arr){ return arr[Math.floor(this.random() * arr.length)]; }
  shuffle(arr){
    const a = arr.slice();
    for (let i = a.length-1; i>0; i--){
      const j = Math.floor(this.random() * (i+1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  randint(min, max){ return min + Math.floor(this.random() * (max - min + 1)); }
}
let RNG = new RandomGenerator((Date.now() ^ 0x9e3779b9) >>> 0);

// ═══════════════════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════════════════

}
function texRect(x, y, w, h, base){

}
initPatterns();

const game = {
  state: 'TITLE',
  bibleOpen: false,
  biblePage: 'overview',
  bibleScroll: 0,
  bibleDetail: null,
  bibleSearch: '',
  verseHighlight: -1,  // which word in the current verse to highlight (-1 = none)
  verseHighlightTimer: 0,
  floor: 1,
  hp: 50, maxHp: 50,
  gold: 0,
  shield: 0,
  attackBuff: 0,
  defenseBuff: 0,
  seed: 0,
  nemesisEncounters: 0,
  nemesisDone: {},
  discoveredCount: 0,
  // node the player is about to enter (EXPLORE)

  combatNext: 'MAP',

  lastDeathText: '',

// Timer preference persists across runs
game.timerEnabled = localStorage.getItem('seven_falls_timer') !== 'false';

// Combat object (built in startCombat)
let combat = null;

// Event / shop / rest transient data
let activeEvent = null;
let shopItems = [];
let shopBought = {};

// Clickable regions rebuilt every frame
let clickables = [];
// Last known pointer position (canvas coords) for hover effects
let pointer = { x: -999, y: -999 };

// ═══════════════════════════════════════════════════════════════
// DRAW HELPERS
// ═══════════════════════════════════════════════════════════════
function setFont(size){ ctx.font = size + 'px "Press Start 2P", monospace'; }
function text(t, x, y, color, size, align){
  setFont(Math.round((size || 8) * S));
  ctx.fillStyle = color || C.white;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'top';
  t = String(t);
  const a = ctx.textAlign;
  // Bounds guard: keep a string inside the canvas [0, W]. This is a last-resort
  // safety net, NOT a layout tool — callers are expected to wrap their own text
  // to the panel width. Anything that trips it is clipped with an ellipsis and
  // recorded, so the QA harness (window.__SF_QA) can fail hard on overflow
  // instead of shipping a sentence that stops mid-word.
  let mw;
  if (a === 'left'){ mw = W - x - 2; if (mw < 4){ x = 2; mw = W - 4; } }
  else if (a === 'right'){ mw = Math.max(4, x - 2); }
  else { mw = Math.max(4, Math.min(x, W - x) - 2) * 2; }
  let cut = false;
  while (t.length > 1 && ctx.measureText(t).width > mw){ t = t.slice(0, -1); cut = true; }
  if (cut) t = t.slice(0, -1) + '…';
  if (cut && window.__SF_QA){
    const q = window.__SF_QA_TEXT || (window.__SF_QA_TEXT = []);
    q.push({ t, x, y, size, align: a, mw: Math.round(mw), w: Math.round(ctx.measureText(t).width),
             stack: (new Error().stack || '').split('\n').slice(2, 4).map(function(l){ return l.trim().replace(/^at /, '').slice(0, 70); }).join(' <- ') });
  }
  ctx.fillText(t, x, y);
}
function rect(x, y, w, h, color){ ctx.fillStyle = color; ctx.fillRect(x, y, w, h); }
function strokeRect(x, y, w, h, color){ ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.strokeRect(x+0.5, y+0.5, w-1, h-1); }
function shadeColor(hex, pct){
  let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  r = Math.max(0, Math.min(255, r + pct));
  g = Math.max(0, Math.min(255, g + pct));
  b = Math.max(0, Math.min(255, b + pct));
  return '#' + [r,g,b].map(c => c.toString(16).padStart(2,'0')).join('');
}
function wrapText(t, maxChars){
  const words = String(t).split(' ');
  const lines = []; let line = '';
  for (const w of words){
    if ((line + w).length > maxChars){ lines.push(line.trim()); line = w + ' '; }
    else line += w + ' ';
  }
  if (line.trim()) lines.push(line.trim());
  const rev = (i) => lines[i].split(' ');
  for (let i = 0; i < lines.length - 1; i++){
    const parts = rev(i);
    if (parts.length < 2) continue;
    if (!HANG_WORDS.has(parts[parts.length - 1].toLowerCase())) continue;
    const moved = parts[parts.length - 1] + ' ' + lines[i + 1];
    if (moved.length > maxChars) continue;
    lines[i] = parts.slice(0, -1).join(' ');
    lines[i + 1] = moved;
  }
  if (lines.length > 1 && rev(lines.length - 1).length === 1){
    const prev = rev(lines.length - 2);
    if (prev.length > 1){
      const moved = prev[prev.length - 1] + ' ' + lines[lines.length - 1];
      if (moved.length <= maxChars){
        lines[lines.length - 2] = prev.slice(0, -1).join(' ');
        lines[lines.length - 1] = moved;

}
// ── Modern chrome primitives ──────────────────────────────
// arcTo-based rounded path: works on old WebViews where ctx.roundRect is absent.
function roundRectPath(x, y, w, h, r){

  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);

}
// A card surface: soft fill + hairline edge. Use instead of raw rect() for panels.
function panel(x, y, w, h, r, fillColor){
  roundRectPath(x, y, w, h, r == null ? 4 : r);
  ctx.fillStyle = fillColor || C.panel;
  ctx.fill();
  roundRectPath(x + 0.5, y + 0.5, w - 1, h - 1, r == null ? 4 : r);

}
// Vertical sheen, clipped to the current path. Fake depth on flat fills.
function sheen(x, y, w, h, alpha){
  ctx.save(); ctx.clip();
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,' + (alpha == null ? 0.05 : alpha) + ')');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  ctx.restore();
}
function button(x, y, w, h, label, onClick, color, txtColor, fill){
  const hovered = pointIn(pointer.x, pointer.y, x, y, w, h);
  const accent = color || C.gold;
  const base = fill || C.stoneDark;
  const rad = h >= 16 ? 4 : 2;

  // body: subtle vertical gradient so buttons read as raised, not painted on
  roundRectPath(x, y, w, h, rad);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, shadeColor(base, hovered ? 30 : 14));
  g.addColorStop(1, shadeColor(base, hovered ? 8 : -8));
  ctx.fillStyle = g; ctx.fill();
  sheen(x, y, w, h, hovered ? 0.09 : 0.05);

  // edge: one neutral chrome language. Accent colour is reserved for the label
  // (and hover), instead of every control getting its own coloured outline —
  // which read as debug flags rather than a system.
  roundRectPath(x + 0.5, y + 0.5, w - 1, h - 1, rad);
  ctx.strokeStyle = hovered ? accent : (fill ? shadeColor(accent, -70) : C.edge);
  ctx.lineWidth = 1; ctx.stroke();

  // label: fit by shrinking, then ellipsis — bounded and monotonic
  let lbl = String(label);
  let fs = Math.round((h >= 18 ? 7 : 6) * S);
  const maxW = w - 10;
  setFont(fs);
  let guard = 0;
  while (lbl.length > 1 && fs > 6 && guard++ < 20 && ctx.measureText(lbl).width > maxW){ fs -= 1; setFont(fs); }
  if (ctx.measureText(lbl).width > maxW && lbl.length > 2) lbl = lbl.slice(0, -1) + '…';
  ctx.textAlign = 'center';
  text(lbl, x + w / 2, y + h / 2 - fs / 2 - 1, hovered ? accent : (txtColor || C.holy), (h >= 18 ? 7 : 6), 'center');

}
function bar(x, y, w, h, frac, color, bg){
  const bgc = bg || C.stone;
  rect(x, y, w, h, bgc);
  const f = Math.max(0, Math.min(1, frac));
  if (f > 0){
    // gradient fill for depth
    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, color);
    grad.addColorStop(1, shadeColor(color, -30));
    ctx.fillStyle = grad;
    ctx.fillRect(x, y, f * w, h);

    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(x, y, f * w, Math.max(1, h/3));
  }

  const c = 2;
  rect(x, y, c, c, bgc);
  rect(x + w - c, y, c, c, bgc);
  rect(x, y + h - c, c, c, bgc);
  rect(x + w - c, y + h - c, c, c, bgc);
  strokeRect(x, y, w, h, C.stone2);

// Point-in-rect test (for hover + hint hit testing)
function pointIn(px, py, x, y, w, h){ return px >= x && px <= x + w && py >= y && py <= y + h; }

// ── First-time hint system ────────────────────────────────
function showHint(id, text, permanent){
  if (game.hintsShown[id]) return;
  game.hintsShown[id] = true;

    const p = JSON.parse(localStorage.getItem('seven_falls_hints_permanent') || '[]');

  }

  if (!game.activeHint) game.activeHint = { text: game.hintQueue.shift(), timer: 5 };
}
function dismissHint(){
  const t = game.hintQueue.shift();
  game.activeHint = t ? { text: t, timer: 5 } : null;
}

// ── Combat particle sparkles ──────────────────────────────
function spawnSparkles(x, y, n){
  const cols = [C.gold, C.holy, C.white];
  for (let i = 0; i < n; i++){
    game.particles.push({
      x, y,

function spawnTypedParticles(x, y, n, color){
  for (let i = 0; i < n; i++){

      x, y,

// Floating text (damage numbers, heal numbers, etc.)
function drawFloatingText(){
  const ft = combat ? combat._floatingText : null;
  if (!ft) return;
  ft.t += 1/60;
  if (ft.t > ft.life) { combat._floatingText = null; return; }
  const alpha = Math.max(0, 1 - ft.t / ft.life);
  const yOff = ft.t * -30; // float upward
  ctx.globalAlpha = alpha;
  setFont(Math.round(10 * S));
  ctx.fillStyle = ft.color;
  ctx.textAlign = 'center';

}

  for (const p of game.particles){ p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 60 * dt; }
  game.particles = game.particles.filter(p => p.t < p.life);
}
function drawParticles(){
  for (const p of game.particles){
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
    const sz = p.size || 2;
    rect(p.x - sz/2, p.y - sz/2, sz, sz, p.c);

// ── Detailed demon sprite (drawn behind combat UI) ────────
function drawDemonSprite(cx, cy, hurt){
  ctx.save();
  ctx.globalAlpha = hurt ? 0.34 : 0.22;

  ctx.fillStyle = c;

// ═══════════════════════════════════════════════════════════════
// ITEM & SPRITE SYSTEM (Pokemon-style overhaul)
// ═══════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════
// SECRET VERSE UNLOCKS
// ═══════════════════════════════════════════════════════════════
const SecretVerses = {
  _key: 'seven_falls_secret_verses',
  _unlocked: null,
  _notifications: [],
  _defs: [
    { id: 'secret_resurrection', name: 'Resurrection',   condition: 'no_death_run',   desc: 'Complete a run without dying.',   ref: 'John 11:25' },
    { id: 'secret_dominion',     name: 'Dominion',        condition: 'all_types',      desc: 'Discover all 8 demon types.',     ref: 'Genesis 1:28' },
    { id: 'secret_parables',     name: 'The Parables',    condition: 'easter_egg',     desc: 'Trigger the 7:77 Easter egg.',    ref: 'Psalm 78:2' },
    { id: 'secret_depths',       name: 'Depths Unknown',  condition: 'floor_10',       desc: 'Reach floor 10.',                 ref: 'Romans 11:33' },
  ],
  _load() {
    if (this._unlocked !== null) return;
    try { this._unlocked = JSON.parse(localStorage.getItem(this._key) || '[]'); } catch(e) { this._unlocked = []; }
  },
  isUnlocked(id) { this._load(); return this._unlocked.includes(id); },
  unlock(id) {
    this._load();
    if (!this._unlocked.includes(id)){
      this._unlocked.push(id);
      localStorage.setItem(this._key, JSON.stringify(this._unlocked));
      const def = this._defs.find(d => d.id === id);
      if (def) this._notifications.push(def);
      return true;
    }
    return false;
  },
  getNotifications() { const n = this._notifications.slice(); this._notifications = []; return n; },
  checkRunEnd(stats) {
    // no_death_run: won and diedThisRun is false
    if (stats.won && !stats.diedThisRun) this.unlock('secret_resurrection');
    // all_types: discoveredTypes has 8+ unique types
    if (stats.discoveredTypes && stats.discoveredTypes.length >= 8) this.unlock('secret_dominion');
    // easter_egg: triggered 7:77
    if (stats.triggeredEasterEgg) this.unlock('secret_parables');
    // floor_10: reached floor 10
    if (stats.floor >= 10) this.unlock('secret_depths');
  },
  _notifTimer: 0,
  renderNotifications(dt) {
    if (this._notifications.length === 0) return;
    this._notifTimer += dt;
    if (this._notifTimer > 4){ this._notifications.shift(); this._notifTimer = 0; return; }
    const n = this._notifications[0];
    const alpha = this._notifTimer < 0.5 ? this._notifTimer * 2 : this._notifTimer > 3.5 ? (4 - this._notifTimer) * 2 : 1;
    ctx.save();
    ctx.globalAlpha = alpha;
    rect(W/2 - 80, 8, 160, 24, 'rgba(30,10,50,0.9)');
    strokeRect(W/2 - 80, 8, 160, 24, C.gold);
    text('SECRET UNLOCKED', W/2, 11, C.gold, 6, 'center');
    text(n.name + ' — ' + n.ref, W/2, 20, C.holy, 5, 'center');
    ctx.restore();
  }
};

// ── Item definitions ──
const ITEM_DEFS = {
  holy_water:   { name:'Holy Water',    icon:'💧', desc:'Heals 20 HP',   rarity:'common' },
  scroll_fire:  { name:'Scroll Fire',   icon:'🔥', desc:'+10 DMG next',  rarity:'rare' },
  prayer_beads: { name:'Prayer Beads',  icon:'📿', desc:'+15 shield',    rarity:'common' },
  exorcism_salt:{ name:'Exorcism Salt', icon:'🧂', desc:'Stun 1 turn',   rarity:'uncommon' },
  golden_censer:{ name:'Golden Censer', icon:'🔔', desc:'Reveal weakness',rarity:'rare' },
  iron_cross:   { name:'Iron Cross',    icon:'✟',  desc:'+5 def (perm)', rarity:'veryrare' },
};
const ITEM_KEYS = Object.keys(ITEM_DEFS);

function addItem(type){
  if (!game.items) game.items = [];
  if (game.items.length >= 5) return false;
  game.items.push(type);
  return true;
}
function randomItemType(){
  const weights = { common:40, uncommon:22, rare:12, veryrare:5 };
  const bag = [];
  for (const k of ITEM_KEYS){
    const w = weights[ITEM_DEFS[k].rarity] || 10;
    for (let i = 0; i < w; i++) bag.push(k);
  }
  return bag[Math.floor(RNG.random() * bag.length)];
}

// ── Use an item (consumes your turn) ──
function useItem(idx){
  if (!combat || game.state !== 'COMBAT') return;
  if (idx < 0 || idx >= game.items.length) return;
  const type = game.items[idx];
  const def = ITEM_DEFS[type];
  let causedStun = false;
  switch (type){
    case 'holy_water':    game.hp = Math.min(game.maxHp, game.hp + 20); break;
    case 'scroll_fire':   combat.flatBonus = (combat.flatBonus || 0) + 10; break;
    case 'prayer_beads':  game.shield += 15; break;
    case 'exorcism_salt': causedStun = true; break;
    case 'golden_censer': combat.revealedWeak = combat.demon.weakTo || 'scripture'; break;
    case 'iron_cross':    game.defenseBuff += 5; break;
  }
  game.items.splice(idx, 1);
  combat.selected = [];
  combat.message = def.icon + ' ' + def.name + ' used.';
  combat.msgTimer = 1.4;
  // Using an item takes your turn (demon still attacks unless currently stunned)
  if (combat.stunTurns > 0){
    // enemy is already stunned from a previous turn — it loses this attack
    combat.stunTurns--;
    combat.twistTriggered.push(combat.demon.name + ' is stunned!');
  } else {
    demonAttack(true);
    if (game.hp <= 0){ die(); return; }
  }
  // A stun from THIS item applies to the enemy's NEXT turn (after the current one)
  if (causedStun) combat.stunTurns = (combat.stunTurns || 0) + 1;
  loadVerse();
}

// ── Escape chance calculation ──
// (No explicit "player level" exists; descent depth game.floor is used as level.)
function calcEscapeChance(){
  if (!combat) return 10;
  const d = combat.demon;
  let pct = 40;
  if (game.shield > 0) pct += 5;
  if (combat.isElite || combat.isBoss || combat.isNemesis) pct -= 15;
  if (d.tier >= DEMON_TIER.FALLEN_ANGEL) pct -= 25;
  if (d.tier >= DEMON_TIER.POWER) pct -= 10;
  return Math.max(10, Math.min(85, pct));
}

// ── Attempt to flee ──
function tryFlee(){
  if (!combat || game.state !== 'COMBAT') return;
  if (combat.isLust && !combat.lustBroken) {
    combat.message = 'The seduction holds you! Attack to break free!';
    combat.msgTimer = 2.0;
    return;
  }
  const pct = calcEscapeChance();
  if (RNG.random() * 100 < pct){
    game.state = 'MAP';
  } else {
    combat.message = 'Escape failed! (' + pct + '% chance) The demon strikes!';
    combat.msgTimer = 2.0;
    demonAttack(true);
    if (game.hp <= 0){ die(); return; }
    loadVerse();
  }
}

// ── Hint overlay (bottom of screen) ──
// Wrap by MEASURED pixel width. wrapText() counts characters, which overflowed
// the box at this font size and made every line render ellipsised ("The glow..").
const HANG_WORDS = new Set(['a','an','the','of','to','and','or','with','in','on','at','for','from','by','as','is','was','its','his','her','my','our','your','no','not']);
function wrapTextPx(t, maxW, size){
  setFont(Math.round((size || 6) * S));
  const words = String(t).split(/\s+/).filter(Boolean);
  const out = [];
  let line = '';
  for (const w of words){
    const probe = line ? line + ' ' + w : w;
    if (!line || ctx.measureText(probe).width <= maxW) line = probe;
    else { out.push(line); line = w; }
  }
  if (line) out.push(line);
  const fits = (s2) => ctx.measureText(s2).width <= maxW;
  // Pull a trailing article/preposition down — "you find a / demon corpse"
  // reads as a typo, not a wrap.
  for (let i = 0; i < out.length - 1; i++){
    const parts = out[i].split(' ');
    if (parts.length < 2) continue;
    const tail = parts[parts.length - 1];
    if (!HANG_WORDS.has(tail.toLowerCase())) continue;
    const moved = tail + ' ' + out[i + 1];
    if (!fits(moved)) continue;
    out[i] = parts.slice(0, -1).join(' ');
    out[i + 1] = moved;
  }
  // A one-word last line is an orphan. Rebalance it upward.
  if (out.length > 1){
    const last = out[out.length - 1].split(' ');
    if (last.length === 1){
      const prev = out[out.length - 2].split(' ');
      if (prev.length > 1){
        const moved = prev[prev.length - 1] + ' ' + out[out.length - 1];
        if (fits(moved)){
          out[out.length - 2] = prev.slice(0, -1).join(' ');
          out[out.length - 1] = moved;
        }
      }
    }
  }
  return out;
}
function renderHint(){
  if (!game.activeHint) return;
  const x = 6, w = W - 12;
  // Anchor above the footer control (button sits at H-16..H-2). A fixed 30px
  // panel at H-32 used to overlap it — LEAVE was unreadable behind the toast.
  const lines = wrapTextPx(game.activeHint.text, w - 16, 6).slice(0, 3);
  const h = lines.length * 9 + 8;

}

// Verse types currently represented by the player's in-progress selection
function selectedTypes(){
  if (!combat) return [];
  const types = [];
  for (const i of combat.selected){
    const e = combat.pool[i];
    if (e && e.v >= 0) types.push(combat.verses[e.v].type);
  }
  return types;
}
// Which target verse the current selection best matches as a prefix (-1 = none)
function activeVerseIndex(){
  if (!combat) return -1;
  const sel = combat.selected.map(i => combat.pool[i].word);
  let best = -1, bestLen = -1;
  for (let vi = 0; vi < combat.verses.length; vi++){
    const w = combat.verses[vi].words;
    let k = 0;
    while (k < sel.length && k < w.length && sel[k] === w[k]) k++;
    if (k > bestLen){ bestLen = k; best = vi; }
  }
  return best;
}

function demonTypeKey(d){

function startCombat(node){
  let demon, isBoss = false, isElite = false, isNemesis = false;

  if (node.type === NODE_TYPE.BOSS){
    demon = getBossForFloor(game.floor); isBoss = true;
  } else if (node.type === NODE_TYPE.ELITE){
    demon = getEliteDemon(game.floor); isElite = true;
  } else {
    // normal combat — possibly the Nemesis on floors 3/6/9
    if (game.floor % 3 === 0 && game.floor > 1 && !game.nemesisDone[game.floor]){
      demon = NemesisSystem.getScaled();
      NemesisSystem.onEncounter();
      game.nemesisDone[game.floor] = true;
      isNemesis = true;
      if (!game.hintsShown['nemesis']) showHint('nemesis', 'The Stalker returns every 3 floors. It grows stronger.', true);
    } else {
      demon = getDemonForFloor(game.floor);
    }
  }

  AdaptiveDifficulty.applyToDemon(demon);

  // Progressive HP scaling: floors 1-2 are tutorial-easy (10-15 HP)
  if (game.floor <= 2 && !isBoss && !isElite){
    demon.hp = Math.min(demon.hp, 10 + game.floor * 5);  // floor 1: 15, floor 2: 20
    demon.maxHp = demon.hp;
  } else if (game.floor <= 4 && !isBoss && !isElite){
    demon.hp = Math.min(demon.hp, 20 + game.floor * 8);  // floor 3: 44, floor 4: 52
    demon.maxHp = demon.hp;
  }

  combat = {
    demon,
    isBoss, isElite, isNemesis,
    key: demonTypeKey(demon),
    verses: [], pool: [], selected: [],
    usedWords: new Set(),
    verseTypesUsed: [],   // verse types used this combat (combo tracking)
    _typeHistory: [],      // last few types (fatigue/synergy)
    _enemyTurns: 0, _lastDmgTurn: 0,
    correctStreak: 0,     // consecutive correct verses (ultimate trigger)
    adds: [],             // reinforcement enemies
    resistance: null,     // adaptive-resisted verse type
    timer: 0, maxTimer: 10,
    message: '', msgTimer: 0,
    buffNext: 0,
    turn: 0, turnCount: 0,
    comboResult: null,    // active combo result to render
    twistTriggered: [],   // twist messages to display
    isSwarm: false, swarmTimer: 0, swarmCount: 0,
    flatBonus: 0, stunTurns: 0,
    isLust: (demon.type === 'lust' || demon.sin === 'Lust'),
    lustHits: 0, lustBroken: false, revealedWeak: null,
    _phase2: false, _evolved: false, _stolen: false, _cycleTick: 0,
  };
  MECH.initEnemy(demon, game.floor);
  CombatTwists.twistTriggered = [];
  CombatTwists.swarmMode = false;
  KnowledgeSystem.observeDemon(combat.key);
  loadVerse();
  if (combat.isLust){
    combat.message = 'The Veiled Whisper clouds your mind. You cannot think of escape...';
    combat.msgTimer = 6;
  }
  game.state = 'COMBAT'; MusicEngine.playTrack('combat');
}

function loadVerse(){
  // Apply easy-verse difficulty scaling if VerseDifficulty module is present
  if (typeof VerseDifficulty !== 'undefined') {
    combat.verses = VerseDifficulty.getScaledVersePair(game.floor, getCombatVersePair);
    combat.usedWords = new Set();
  } else {
    combat.verses = getCombatVersePair(game.floor);
    combat.usedWords = new Set();
  }
  // If every offered verse's PLAYABLE words are fully solved, draw a fresh pair.
  // (Uses verseWords so easy-mode shortened verses count correctly, not the full .words)
  const allDone = combat.verses.every(v => verseWords(v).every(w => combat.usedWords.has(w)));
  if (allDone){
    combat.verses = getCombatVersePair(game.floor);
    combat.usedWords = new Set();
  }
  combat.pool = getCombatPool(combat.verses, game.floor, combat.usedWords);
  // ponytail: the tile grid stops rendering at y+bh > 243, so a pool longer than
  // the grid makes some words invisible AND unclickable — the verse then cannot
  // be completed and the demon cannot be damaged. Cap the pool, and never drop a
  // correct word (v >= 0): only Bible extras and decoys are expendable.
  const MAX_TILES = 24;
  if (combat.pool.length > MAX_TILES) {
    const mustKeep = combat.pool.filter(t => t.v >= 0);
    const optional = combat.pool.filter(t => t.v < 0);
    combat.pool = mustKeep.concat(optional.slice(0, Math.max(0, MAX_TILES - mustKeep.length)));
  }
  // Solvability invariant: every offered verse must be spellable from the pool.
  // This is the assert that would have caught both blocking combat bugs on day
  // one — if it ever fails, combat is unwinnable, so say so loudly.
  (function assertSolvable(){
    const words = combat.pool.map(p => p.word);
    for (const v of combat.verses){
      const need = verseWords(v);
      const used = new Set();
      let ok = true;
      for (const w of need){
        let found = -1;
        for (let i = 0; i < words.length; i++){
          if (!used.has(i) && words[i] === w){ found = i; break; }
        }
        if (found < 0){ ok = false; break; }
        used.add(found);
      }
      if (!ok) console.error('SEVEN FALLS UNPLAYABLE: verse not spellable from pool:', (v.reference || v.id), need);
    }
  })();
  combat.selected = [];
  for (const v of combat.verses) KnowledgeSystem.discoverVerse(v.id);
  game.discoveredCount = KnowledgeSystem.store.discoveredVerses.length;
  // Timer: 2 minutes
  combat.maxTimer = 120;
  if (MECH.flowActive) combat.maxTimer = 999; // frozen while flow active
  combat.timer = combat.maxTimer;
  if (!game.hintsShown['combat']) showHint('combat', 'Tap words to form Bible verses. The glowing word is next!', true);
  game.verseHighlight = 0;
  game.verseHighlightTimer = 0;
}

function selectWord(idx){
  if (!combat) return;
  if (typeof SFX !== 'undefined') SFX.play('select');
  if (combat.selected.includes(idx)){ // tap again to deselect
    combat.selected = combat.selected.filter(s => s !== idx);
    return;
  }
  combat.selected.push(idx);
  // auto-submit when the selection already forms a full verse
  if (checkVerse(combat.selected.map(i => combat.pool[i]), combat.verses)) submitVerse();
}

function clearSelection(){ if (combat) combat.selected = []; }

function submitVerse(){
  if (!combat) return;
  const chosen = combat.selected.map(i => combat.pool[i]);
  const match = checkVerse(chosen, combat.verses);
  if (!match){
    // Scattered words — the verse slips away
    combat.message = 'SCATTERED! The words dissolve...';
    combat.msgTimer = 1.4;
    combat.correctStreak = 0;
    combat.comboResult = null;
    combat.twistTriggered = [];
    combat.selected = [];
    demonAttack(false);
    if (game.hp <= 0){ die(); return; }
    loadVerse();
    return;
  }
  resolveVerse(match);
  if (typeof SFX !== 'undefined') SFX.play('verse');
}

function resolveVerse(verse){
  const cat = verseCardType(verse);
  // ── #25 ENEMY IMMUNITY: floor 7+ immune to one type ──
  if (MECH.isImmune(verse.type)){
    combat.message = combat.demon.name + ' is IMMUNE to ' + verse.type.toUpperCase() + ' verses! Choose another.';
    combat.msgTimer = 2.0;
    combat.correctStreak = 0;
    combat.selected = [];
    if (typeof SFX !== 'undefined') SFX.play('error');
    loadVerse();
    return;
  }
  let dmg = verse.damage;
  // Dev mode: one-shot kills
  if (game.devMode) dmg = 9999;
  const mult = getDamageMultiplier(combat.demon.type, verse.type, combat.demon.weakTo);
  if (combat.buffNext > 0){ dmg = Math.floor(dmg * (1 + combat.buffNext)); combat.buffNext = 0; }
  // #23 VERSE FATIGUE: 0.7x if same type 3x in a row
  dmg = Math.floor(dmg * MECH.fatigueMult());
  // #20 SYNERGY: Holy Wisdom (Praise+Wisdom) +20% wisdom dmg
  dmg = Math.floor(dmg * MECH.synergyBonus(verse.type));
  let resistedNote = '';
  if (CombatTwists.isResisted(verse.type)){
    dmg = Math.floor(dmg * 0.5);
    resistedNote = ' (resisted!)';
  }
  if (combat.isSwarm){ dmg = Math.max(1, Math.floor(dmg * 0.6)); }
  dmg = Math.max(1, Math.floor(dmg * mult));
  if (combat.flatBonus){ dmg += combat.flatBonus; combat.flatBonus = 0; }
  // #16 FLOW STATE: double damage when active
  if (MECH.flowActive) dmg = Math.floor(dmg * 2);
  // #24 CRITICAL HIT: 15% → 2x
  const crit = MECH.rollCrit(dmg);
  dmg = crit.dmg;
  // #21 ENEMY SHIELD PHASES: non-DEFENSE verses are blocked by an active shield.
  // Must be checked BEFORE applying damage so the shield actually absorbs the hit.
  let shieldBlocked = false;
  if (MECH.isShielded()){
    const sc = verseCardType(verse);
    if (sc !== 'DEFENSE'){
      combat.demon._shieldPhase--;
      shieldBlocked = true;
      combat.message = combat.demon.name + ' SHIELD absorbs the strike! (' + Math.max(0, combat.demon._shieldPhase) + ' left)';
      combat.msgTimer = 1.6;
    } else {
      combat.demon._shieldPhase = 0;
      combat.message = 'Shield broken by faith!';
    }
  }
  if (!shieldBlocked) combat.demon.hp -= dmg;
  // reset enemy-evolution idle counter (player dealt damage this turn)
  combat._lastDmgTurn = combat.turnCount;
  // flag so post-resolve skips boss-phase/flow checks if fully blocked (already messaged)
  combat._shieldBlockedThisTurn = shieldBlocked;

  // ── VERSE-TYPE VISUAL EFFECTS ──
  const typeColors = { praise:'#ffe066', wisdom:'#aa66ff', warfare:'#4488ff', fire:'#ff4422', mercy:'#44ff88' };
  const typeNames = { praise:'Praise', wisdom:'Wisdom', warfare:'Warfare', fire:'Fire', mercy:'Mercy' };
  const vcol = typeColors[verse.type] || C.white;

  if (cat === 'ATTACK') {
    // ATTACK: red flash on demon + red sparkles + damage number
    spawnTypedParticles(260, 40, 20, '#ff4444');
    game.flash = 0.3;
    combat._floatingText = { text: '-' + dmg + (crit.crit ? '!' : ''), x: 260, y: 30, color: crit.crit ? '#ffff00' : '#ff4444', t: 0, life: 1.0 };
  } else if (cat === 'DEFENSE') {
    // DEFENSE: blue shield glow + heal number
    spawnTypedParticles(50, 180, 12, '#4488ff');
    const e = verse.effect;
    let healAmt = 0;
    if (e === 'shield') { game.shield += 10; healAmt = 10; }
    else if (e === 'armor') { game.shield += 14; healAmt = 14; }
    else if (e && e.startsWith('heal')) { healAmt = parseInt(e.split('_')[1] || '5', 10); }
    if (healAmt > 0) combat._floatingText = { text: '+' + healAmt, x: 50, y: 170, color: '#44ff88', t: 0, life: 1.0 };
    else combat._floatingText = { text: 'SHIELD', x: 50, y: 170, color: '#4488ff', t: 0, life: 1.0 };
    game.shield = (game.shield || 0) + (healAmt > 0 ? 0 : 10);
  } else if (cat === 'BUFF') {
    // BUFF: gold sparkles rising
    spawnTypedParticles(W/2, 180, 16, '#ffd700');
    combat._floatingText = { text: 'BUFF +50%', x: W/2, y: 170, color: '#ffd700', t: 0, life: 1.0 };
  } else if (cat === 'DEBUFF') {
    // DEBUFF: purple swirl on demon
    spawnTypedParticles(260, 40, 12, '#aa44ff');
    combat._floatingText = { text: 'DEBUFF', x: 260, y: 30, color: '#aa44ff', t: 0, life: 1.0 };
  } else if (cat === 'ULTIMATE') {
    // ULTIMATE: massive gold flash + screen shake
    spawnTypedParticles(W/2, H/2, 30, '#ffd700');
    game.goldFlash = 0.8;
    game.flash = 0.5;
    game.shakeTimer = 0.4;
    game.shakeIntensity = 8;
    combat._floatingText = { text: 'ULTIMATE!', x: W/2, y: 80, color: '#ffd700', t: 0, life: 1.5 };
  }

  // Effect-specific messages
  let effMsg = '';
  if (cat === 'DEFENSE') {
    const e = verse.effect;
    if (e === 'shield') { effMsg = 'SHIELD +10'; }
    else if (e === 'armor') { effMsg = 'ARMOR +14'; }
    else if (e && e.startsWith('heal')) {
      const n = parseInt(e.split('_')[1] || '5', 10);
      effMsg = 'HEAL +' + n;
    }
  } else if (cat === 'BUFF') {
    combat.buffNext += 0.5;
    effMsg = 'NEXT ATTACK +50%';
  }

  // Retire words from pool
  if (!combat.usedWords) combat.usedWords = new Set();
  for (const w of verse.words) combat.usedWords.add(w);
  spawnSparkles(W/2, 60, 14);

  // Track for combos + adaptive AI
  if (!combat.verseTypesUsed.includes(verse.type)) combat.verseTypesUsed.push(verse.type);
  combat.correctStreak++;
  CombatTwists.recordVerseType(verse.type);
  combat.lastPlayerDamage = dmg;

  // ── Verse Combo System ──
  const ctx = { correctStreak: combat.correctStreak, floor: game.floor, isBoss: combat.isBoss };
  const combos = VerseComboSystem.detectCombo(combat.verseTypesUsed, ctx);
  if (combos.length > 0){
    const combo = combos[combos.length - 1];
    const res = VerseComboSystem.applyCombo(combo, combat, game);
    let extra = '';
    if (res.damage){ combat.demon.hp -= res.damage; extra += ' ' + res.damage + ' combo dmg'; }
    if (res.heal){ game.hp = Math.min(game.maxHp, game.hp + res.heal); extra += ' +' + res.heal + ' HP'; }
    if (res.shield){ game.shield += res.shield; extra += ' +' + res.shield + ' SH'; }
    if (res.doubleNext) combat.buffNext += 1.0;
    if (res.stunTurns) combat.twistTriggered.push(combat.demon.name + ' STUNNED ' + res.stunTurns + ' turns!');
    if (res.debuffAttack) combat.demon._debuffAtk = res.debuffAttack;
    combat.comboResult = { name: combo.name, quote: combo.quote, extra };
    game.goldFlash = (mult > 1) ? 0.5 : 0;
    game.comboAnim = 1.2;
    combat.message = typeNames[verse.type] + ' ' + verse.reference + '  -' + dmg + (mult > 1 ? '!' : '') + resistedNote +
                     '  >> ' + combo.name.toUpperCase() + '!' + extra;
    combat.msgTimer = 2.2;
    if (!game.hintsShown['combo']) showHint('combo', 'Words from different verses can combine!');
  } else {
    combat.comboResult = null;
    if (mult > 1) game.goldFlash = 0.5;
    combat.message = typeNames[verse.type] + ' ' + verse.reference + '  -' + dmg + (mult > 1 ? '!' : '') + resistedNote +
                     (effMsg ? '  ' + effMsg : '');
    combat.msgTimer = 1.6;
  }
  combat.turn++;
  combat.turnCount++;
  // ── NEW MECHANICS POST-RESOLVE ──
  MECH.recordType(verse.type);
  if (!combat._shieldBlockedThisTurn) {
    // shield did not absorb — proceed with boss phase + flow checks
    MECH.checkBossPhase();
    MECH.checkFlow();
  }
  MECH.evolveCheck();
  MECH.cycleWeakness();
  MECH.trySteal();
  if (MECH._hazard) MECH.hazardTick();
  if (game.hazardNote){ combat.message = (combat.message ? combat.message + '  ' : '') + game.hazardNote; combat.msgTimer = Math.max(combat.msgTimer, 1.8); game.hazardNote = null; }
  // count enemy idle turns (for evolution)
  if (combat._lastDmgTurn < combat.turnCount - 1) combat._enemyTurns++;
  // ── Combat Twists: check each turn ──
  const triggered = CombatTwists.checkTwists(combat, game);
  for (const t of triggered){
    applyTwistResult(t.twist, t.result);
    if (t.result.message) combat.twistTriggered.push(t.result.message);
  }
  // Flee-return check
  const flee = CombatTwists.checkFleeReturn(game.hp, game.maxHp);
  if (flee && flee.return){
    game.hp -= flee.damage;
    combat.twistTriggered.push(flee.message);
  }

  // ── Lust demon special: must attack to break the seduction ──
  if (combat.isLust && !combat.lustBroken){
    if (verse.type === 'wisdom'){
      combat.lustBroken = true;
      combat.message += '  ⟿ Wisdom shatters the illusion — flee now!';
      combat.msgTimer = Math.max(combat.msgTimer, 2.2);
    } else {
      combat.lustHits++;
      if (combat.lustHits >= 3){
        combat.lustBroken = true;
        combat.message += '  ⟿ The spell breaks! You can flee!';
        combat.msgTimer = Math.max(combat.msgTimer, 2.2);
      }
    }
  }

  if (combat.demon.hp <= 0){
    // If swarm active and boss, end swarm then win
    CombatTwists.swarmMode = false;
    winCombat(); return;
  }

  // Demon retaliates
  demonAttack(true);
  if (game.hp <= 0){ die(); return; }

  loadVerse();
}

// Apply a triggered twist's effect object to the combat/game state
function applyTwistResult(twist, result){
  switch (twist.type){
    case CombatTwists.REINFORCEMENTS:
      if (result.adds && result.adds.length){
        for (const a of result.adds) combat.adds.push(a);
      }
      break;
    case CombatTwists.FLEE_ATTACK:
      if (result.flee){
        CombatTwists.fleeingEnemy = {
          name: combat.demon.name,
          returnMessage: result.returnMessage,
          returnDamage: result.returnDamage,
        };
        combat.twistTriggered.push(combat.demon.name + ' slips away...');
      }
      break;
    case CombatTwists.SWARM:
      if (result.timerMode){
        combat.isSwarm = true;
        combat.swarmTimer = result.timer;
        combat.swarmCount = result.swarmCount;
        CombatTwists.swarmMode = true;
        CombatTwists.swarmTimer = result.timer;
        CombatTwists.swarmCount = result.swarmCount;
      }
      break;
    case CombatTwists.ADAPTIVE:
      if (result.resistance){
        combat.resistance = result.resistance;
      }
      break;
    case CombatTwists.PHASE_SHIFT:
      if (result.immuneTo) combat.immuneTo = result.immuneTo;
      break;
    case CombatTwists.MIRROR:
      if (result.mirrorDamage) game.hp = Math.max(0, game.hp - result.mirrorDamage);
      break;
    case CombatTwists.DESPERATION:
      if (result.attackBuff) combat.demon._enrage = result.attackBuff;
      break;
    case CombatTwists.SACRIFICE:
      // handled inside effect (mutates combat.demon.hp + combat.adds)
      break;
    default:
      break;
  }
}

function demonAttack(full){
  if (combat && combat.stunTurns > 0){ combat.stunTurns--; return; }
  let atk = 4 + game.floor * 2 + (combat.demon.tier || 0) * 2;
  atk = Math.floor(atk * (0.6 + AdaptiveDifficulty.getModifier() * 0.4));
  if (game.defenseBuff) atk = Math.max(1, atk - game.defenseBuff);
  if (!full) atk = Math.floor(atk * 0.5);
  if (atk < 1) atk = 1;
  let absorbed = Math.min(game.shield, atk);
  game.shield -= absorbed;
  atk -= absorbed;
  game.hp -= atk;
  if (absorbed > 0) combat.message = (combat.message ? combat.message + '  ' : '') + 'BLOCK ' + absorbed;
}

function winCombat(){
  if (typeof SFX !== 'undefined') SFX.play('victory');
  KnowledgeSystem.slayDemon(combat.key);
  game.gold += combat.demon.gold || 0;
  if (RNG.random() < 0.2){ // 20% enemy drop
    const it = randomItemType();
    if (addItem(it)) game.rewardText = 'The demon drops ' + ITEM_DEFS[it].icon + ' ' + ITEM_DEFS[it].name + '!';
  }
  if (combat.isNemesis) NemesisSystem.onKill();
  // discover the verses we offered for flavor
  for (const v of combat.verses) KnowledgeSystem.discoverVerse(v.id);
  game.discoveredCount = KnowledgeSystem.store.discoveredVerses.length;
  AdaptiveDifficulty.recordWin(game.floor, game.hp === game.maxHp);
  game.state = 'COMBAT_WIN'; MusicEngine.playTrack('victory');
  game.combatNext = combat.isBoss ? 'FLOOR' : 'MAP';
}

function die(){
  if (typeof SFX !== 'undefined') SFX.play('death');
  game.lastDeathText = 'For a just man falleth seven times, and riseth up again: ' +
    'but the wicked shall fall into mischief. — Proverbs 24:16';
  const vs = combat ? (combat.verses[0] || null) : null;
  if (vs) game.lastDeathInsight = KnowledgeSystem.getDeathInsight(combat.key, vs.type);
  else game.lastDeathInsight = 'You fell. But even the fall is written.';
  KnowledgeSystem.recordDeathInsight(game.lastDeathInsight);
  KnowledgeSystem.endRun(game.floor, false);
  AdaptiveDifficulty.recordLoss(game.floor);
  NemesisSystem.onDeath();
  // Meta-progression: record run end (achievements, history, bestiary)
  if (typeof Achievements !== 'undefined') {
    Achievements.checkRunEnd({
      floor: game.floor, won: false, demonsSlain: (KnowledgeSystem.getRunStats().demonsSlain || 0),
      versesKnown: game.discoveredCount || 0, noDamageFloor: (game._noDamageFloor || false),
      maxCombo: (game._maxCombo || 0), usedUltimate: (game._usedUltimate || false),
      usedSacrifice: (game._usedSacrifice || false), discoveredTypes: (game._discoveredTypes || []),
      isDaily: (game._isDaily || false), nemesisKilled: (game._nemesisKilled || false), diedThisRun: true,
    });
  }
  if (typeof MetaProg !== 'undefined') {
    if (game.floor >= 3) localStorage.setItem('seven_falls_daily_unlocked', '1');
    MetaProg.addRun({ date: new Date().toISOString().slice(0,10), floor: game.floor, kills: KnowledgeSystem.getRunStats().demonsSlain || 0, verses: game.discoveredCount || 0, won: false });
    if (combat && combat.demon) MetaProg.recordDiscoveredType(combat.demon.type || 'demon');
  }
  // Secret verse checks
  if (typeof SecretVerses !== 'undefined') SecretVerses.checkRunEnd({
    floor: game.floor, won: false, diedThisRun: true,
    discoveredTypes: game._discoveredTypes || [], triggeredEasterEgg: game._triggeredEasterEgg || false
  });
  game.state = 'DEATH'; MusicEngine.playTrack('death');
}

// ═══════════════════════════════════════════════════════════════
// NODE RESOLUTION (non-combat)
// ═══════════════════════════════════════════════════════════════
function enterNode(node){
  if (!node){ game.state = 'MAP'; return; } // ponytail: total function — null can never crash the frame loop
  game.pendingNode = null;
  switch (node.type){
    case NODE_TYPE.COMBAT:
    case NODE_TYPE.ELITE:
      startCombat(node);
      break;
    case NODE_TYPE.BOSS:
      if (typeof ScreenFX !== 'undefined') {
        ScreenFX.startBossIntro(getBossForFloor(game.floor), () => startCombat(node));
        game.state = 'BOSS_INTRO';
      } else {
        startCombat(node);
      }
      break;
    case NODE_TYPE.EVENT:
      activeEvent = EventEngine.generate(game.floor, {
        floor: game.floor,
        hp: game.hp, maxHp: game.maxHp, gold: game.gold,
        nemesisEncounters: game.nemesisEncounters,
        knownVerses: KnowledgeSystem.getAvailableVerses(),
      });
      game.state = 'EVENT'; MusicEngine.playTrack('event'); break;
    case NODE_TYPE.SHOP:
      shopItems = generateShopItems(game.floor);
      shopBought = {};
      if (!game.hintsShown['shop']) showHint('shop', 'Buy verses and supplies with gold from combat.', true);
      game.state = 'SHOP'; MusicEngine.playTrack('shop'); break;
    case NODE_TYPE.REST:
      if (!game.hintsShown['shrine']) showHint('shrine', 'Pray at shrines to heal and learn new verses.', true);
      game.state = 'REST'; MusicEngine.playTrack('rest'); break;
    case NODE_TYPE.TREASURE:
      rollTreasure(); break;
    default:
      game.state = 'MAP'; MusicEngine.playTrack('map'); break;
  }
}

function rollTreasure(){
  const r = RNG.random();
  if (r < 0.5){
    const g = 20 + game.floor * 5 + RNG.randint(0, 20);
    game.gold += g;
    game.rewardText = 'You find ' + g + ' gold!';
  } else if (r < 0.75){
    const h = 15 + game.floor * 3;
    game.hp = Math.min(game.maxHp, game.hp + h);
    game.rewardText = 'A healing spring restores ' + h + ' HP.';
  } else {
    const v = getRandomVerse(game.floor);
    KnowledgeSystem.discoverVerse(v.id);
    game.discoveredCount = KnowledgeSystem.store.discoveredVerses.length;
    const vText = (typeof getVerseText === 'function') ? getVerseText(v, v.difficulty || 1) : v.text;
      game.rewardText = 'A scroll teaches: "' + vText + '" (' + v.reference + ')';
  }
  if (RNG.random() < 0.4){ // treasure rooms may hold items
    const it = randomItemType();
    if (addItem(it)) game.rewardText += '  Found ' + ITEM_DEFS[it].icon + ITEM_DEFS[it].name + '!';
  }
  game.state = 'TREASURE';
}

function applyEventEffect(effect, cost){
  switch (effect){
    case 'learn_verse': {
      const v = getRandomVerse(game.floor);
      KnowledgeSystem.discoverVerse(v.id);
      game.discoveredCount = KnowledgeSystem.store.discoveredVerses.length;
      const vText2 = (typeof getVerseText === 'function') ? getVerseText(v, v.difficulty || 1) : v.text;
      return 'You learn: "' + vText2 + '" (' + v.reference + ')';
    }
    case 'heal_20':
      game.hp = Math.min(game.maxHp, game.hp + 20);
      return 'You are restored by 20 HP.';
    case 'nothing':
      return 'You move on, unchanged.';
    case 'gold_30_curse':
      game.gold += 30; game.maxHp = Math.max(20, game.maxHp - 5);
      return 'You take 30 gold, but feel weakened (-5 max HP).';
    case 'reveal_weakness':
      return 'The idol crumbles, revealing a demon\'s weakness: ' +
             (combat ? combat.demon.weakTo : 'Scripture.');
    case 'reveal_floor_map':
      return 'Visions show the paths ahead.';
    case 'elite_fight': {
      const fake = { type: NODE_TYPE.ELITE };
      startCombat(fake);
      return null;
    }
    case 'shop_verse':
      if (game.gold >= (cost||20)){ game.gold -= cost; const v=getRandomVerse(game.floor); KnowledgeSystem.discoverVerse(v.id); game.discoveredCount=KnowledgeSystem.store.discoveredVerses.length; const vText3 = (typeof getVerseText === 'function') ? getVerseText(v, v.difficulty || 1) : v.text;
        return 'Bought verse: "'+vText3+'"'; }
      return 'Not enough gold.';
    case 'hp_cost_verse':
      if (game.hp > 10){ game.hp -= 10; const v=getRandomVerse(game.floor); KnowledgeSystem.discoverVerse(v.id); game.discoveredCount=KnowledgeSystem.store.discoveredVerses.length; const vText4 = (typeof getVerseText === 'function') ? getVerseText(v, v.difficulty || 1) : v.text;
        return 'Paid 10 HP to learn: "'+vText4+'"'; }
      return 'Too weak to pay.';
    case 'buff_attack':
      game.attackBuff += 2; return 'Your strikes grow fiercer (+2 attack).';
    case 'buff_defense':
      game.defenseBuff += 2; return 'Your guard hardens (+2 defense).';
    case 'random_buff_or_debuff':
      if (RNG.random() < 0.5){ game.attackBuff += 2; return 'Fortune: +2 attack.'; }
      else { game.maxHp = Math.max(20, game.maxHp - 3); return 'Misfortune: -3 max HP.'; }
    case 'reveal_self':
      return 'Your reflection whispers: "You are stronger than you know."';
    default:
      return 'Nothing happens.';
  }
}

// ═══════════════════════════════════════════════════════════════
// MAP GEOMETRY
// ═══════════════════════════════════════════════════════════════
const NODE_COLOR = {
  [NODE_TYPE.COMBAT]:   C.red,
  [NODE_TYPE.ELITE]:    C.purple,
  [NODE_TYPE.EVENT]:    C.cyan,
  [NODE_TYPE.SHOP]:     C.gold,
  [NODE_TYPE.REST]:     C.green,
  [NODE_TYPE.TREASURE]: C.gold,
  [NODE_TYPE.BOSS]:     C.red,
  [NODE_TYPE.START]:    C.holy,
};
// Node symbols are DRAWN, never typed. The map used to label nodes and the
// legend with ⚔ ☠ ♛ ♥ ◆ ⌂ — none of which exist in Press Start 2P (measured:
// the browser substituted another face at 5.1-8.96px against a 10px advance),
// so glyphs rendered as blanks inside the node discs and ran into the legend
// label beside them. One helper, used by both the map and the legend, so the
// two can never disagree.
const NODE_DISC = '#0d0d1a';
function drawNodeGlyph(type, cx, cy, col){
  const F = (x,y,w,h) => ctx.fillRect(cx+x, cy+y, w, h);
  ctx.save();
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 1.5;
  if (type === NODE_TYPE.COMBAT){                        // crossed swords
    ctx.beginPath(); ctx.moveTo(cx-3.5, cy-3.5); ctx.lineTo(cx+3.5, cy+3.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+3.5, cy-3.5); ctx.lineTo(cx-3.5, cy+3.5); ctx.stroke();
    F(-4, -4.5, 2, 1.5); F(2, 3, 2, 1.5);
  } else if (type === NODE_TYPE.ELITE){                  // skull
    F(-3, -4, 6, 5); F(-2, 1, 4, 1.5); F(-2.5, 2.5, 1.5, 1); F(1, 2.5, 1.5, 1);
    ctx.fillStyle = NODE_DISC; F(-2, -3, 1.5, 1.5); F(0.5, -3, 1.5, 1.5);
  } else if (type === NODE_TYPE.BOSS){                   // crown
    F(-4, 0, 8, 2); F(-4, -2, 1.5, 3); F(-0.75, -4, 1.5, 5); F(2.5, -2, 1.5, 3);
  } else if (type === NODE_TYPE.REST){                   // heart
    ctx.beginPath();
    ctx.moveTo(cx, cy+4); ctx.lineTo(cx-4, cy-0.5); ctx.lineTo(cx-4, cy-2.5);
    ctx.lineTo(cx-2, cy-4); ctx.lineTo(cx, cy-1.5); ctx.lineTo(cx+2, cy-4);
    ctx.lineTo(cx+4, cy-2.5); ctx.lineTo(cx+4, cy-0.5); ctx.closePath(); ctx.fill();
  } else if (type === NODE_TYPE.TREASURE){               // gem
    ctx.beginPath();
    ctx.moveTo(cx, cy-4.5); ctx.lineTo(cx+4.5, cy); ctx.lineTo(cx, cy+4.5);
    ctx.lineTo(cx-4.5, cy); ctx.closePath(); ctx.fill();
  } else if (type === NODE_TYPE.START){                  // house
    ctx.beginPath(); ctx.moveTo(cx, cy-4.5); ctx.lineTo(cx+4.5, cy-0.5);
    ctx.lineTo(cx-4.5, cy-0.5); ctx.closePath(); ctx.fill();
    F(-3, 0, 6, 4);
  } else {                                               // '?' / '$' are in the font
    text(type === NODE_TYPE.SHOP ? '$' : '?', cx, cy+3, col, 6, 'center');
  }
  ctx.restore();
}
function nodePos(node, rows){
  const top = 46, bot = 224;
  // Row 0 (START) renders at the BOTTOM, boss (max row) at the TOP (Slay the Spire style)
  const y = rows <= 1 ? (top+bot)/2 : bot - (bot - top) * node.row / (rows - 1);
  let x = 34 + node.col * 60;
  x = Math.max(14, Math.min(W - 14, x));
  return { x, y };
}

// Soft corner darkening — one cheap depth cue applied to every screen, so flat
// fills stop reading as an unfinished clear-colour.
let VIGNETTE = null;
function vignette(){
  if (!VIGNETTE){
    const g = ctx.createRadialGradient(W/2, H/2, Math.min(W, H) * 0.28, W/2, H/2, Math.max(W, H) * 0.75);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.55)');
    VIGNETTE = g;
  }
  ctx.fillStyle = VIGNETTE;
  ctx.fillRect(0, 0, W, H);
}
function render(){
  clickables = [];
  rect(0, 0, W, H, C.bg);

  switch (game.state){
    case 'TITLE':    renderTitle(); break;
    case 'INTRO':    renderIntro(); break;
    case 'SCHOLAR':  renderScholar(); break;
    case 'MAP':      renderMap(); break;
    case 'EXPLORE':  renderExplore(); break;
    case 'CRAWL':    if (typeof ScreenFX !== 'undefined') ScreenFX.renderCrawl(); break;
    case 'BOSS_INTRO': if (typeof ScreenFX !== 'undefined') ScreenFX.renderBossIntro(); break;
    case 'COMBAT':   renderCombat(); break;
    case 'COMBAT_WIN': renderCombatWin(); break;

    case 'FLOOR_TRANS': renderFloorTrans(); break;

  }

  // Global depth pass, then the fade overlay on top of it

  if (typeof ScreenFX !== 'undefined') ScreenFX.render();
  // Hint overlay (all states)
  renderHint();
  // Achievement toasts (top-center)

function renderMap(){
  const m = mapState.map;
  if (!m){ text('Loading...', W/2, H/2, C.white, 8, 'center'); return; }
  const rows = m.totalRows;

  text('FLOOR ' + game.floor, 8, 4, C.gold, 8, 'left');
  text(FLOOR_TIERS[game.floor-1] ? FLOOR_TIERS[game.floor-1].label : '', 8, 14, C.holy, 6, 'left');
  text('HP ' + game.hp + '/' + game.maxHp, W-8, 4, C.green, 6, 'right');
  text('GOLD ' + game.gold, W-8, 14, C.gold, 6, 'right');
  text('ITEMS ' + (game.items ? game.items.length : 0) + '/5', W-8, 24, C.cyan, 6, 'right');

  // Direction cues: boss at TOP, entrance at BOTTOM (Slay the Spire style)
  text('↑ BOSS', W/2, 4, C.red, 6, 'center');
  text('↓ ENTRANCE', W/2, 242, C.holy, 6, 'center');

  // ── Dark background panel behind the map ──
  texRect(4, 34, W-8, 208, '#0c0c1a');
  strokeRect(4, 34, W-8, 208, C.stone2);

  const pos = id => { const n = m.nodes.find(x => x.id === id); return nodePos(n, rows); };

  // ── Connections: curved bezier paths ──
  for (const n of m.nodes){
    const a = pos(n.id);
    for (const cid of n.connections){
      const b = pos(cid);
      const edgeActive = (m.visited.has(n.id) || n.id === m.currentNodeId) &&
                         (m.visited.has(cid) || cid === m.currentNodeId || canMoveTo(cid));
      ctx.strokeStyle = edgeActive ? C.gold : 'rgba(110,110,150,0.26)';
      ctx.lineWidth = edgeActive ? 2.5 : 1.2;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      const mx = (a.x + b.x) / 2;
      ctx.bezierCurveTo(mx, a.y, mx, b.y, b.x, b.y);
      ctx.stroke();
    }
  }

  // ── Nodes ──
  for (const n of m.nodes){
    const p = pos(n.id);
    const reachable = canMoveTo(n.id);
    const visited = m.visited.has(n.id);
    const isCurrent = (n.id === m.currentNodeId);
    let col = NODE_COLOR[n.type] || C.white;
    if (visited) col = C.stone;
    if (isCurrent) col = C.gold;
    const r = 7;
    // Reachable nodes breathe a gold halo. Before this, reachable and
    // unreachable nodes were drawn identically — the screen gave no answer to
    // the only question a map has to answer, "where can I go?".
    if (reachable && !visited){
      const ph = Date.now() / 260;
      ctx.save();
      ctx.globalAlpha = 0.45 + 0.45 * (0.5 + 0.5 * Math.sin(ph));
      ctx.strokeStyle = C.gold; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 3 + Math.sin(ph) * 1.5, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }
    // dark disc + type-coloured rim keeps the glyph legible; a solid colour
    // fill turned every 14px node into an unreadable dot
    ctx.fillStyle = visited ? '#131220' : NODE_DISC;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = visited ? C.stone2 : (reachable ? C.gold : col);
    ctx.lineWidth = isCurrent ? 2.5 : 2;
    ctx.beginPath(); ctx.arc(p.x+0.5, p.y+0.5, r, 0, Math.PI*2); ctx.stroke();
    if (isCurrent){
      ctx.strokeStyle = C.white; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(p.x+0.5, p.y+0.5, r+2.5, 0, Math.PI*2); ctx.stroke();
    }
    // glyph inside node
    drawNodeGlyph(n.type, p.x, p.y, visited ? C.stone2 : col);

    // no text labels — legend at bottom explains symbols

    if (reachable){
      clickables.push({ x: p.x-8, y: p.y-8, w: 16, h: 16, onClick: () => {
        if (typeof SFX !== 'undefined') SFX.play('click');
        const node = moveToNode(n.id);
        game.pendingNode = node;
        // Dungeon crawl transition. After the crawl, enterNode() handles the
        // boss intro (for BOSS nodes) or starts combat directly. No double-trigger.
        if (typeof ScreenFX !== 'undefined') {
          ScreenFX.startCrawl(node, () => { enterNode(node); });
          game.state = 'CRAWL';
        } else {
          enterNode(node);
        }
      }});
    }
  }

  // ── Legend: clean horizontal dock at the very bottom (outside map frame) ──
  // Two rows of four. Eight icon+label pairs in one 368px row gave each pair
  // 46px; the icon then printed on top of its own label ("Dattle", "Restt").
  const legendItems = [
    [NODE_TYPE.COMBAT,   'Battle',  C.red],
    [NODE_TYPE.ELITE,    'Elite',   C.gold],
    [NODE_TYPE.BOSS,     'Boss',    C.red],
    [NODE_TYPE.EVENT,    'Mystery', C.purple],
    [NODE_TYPE.SHOP,     'Shop',    C.gold],
    [NODE_TYPE.REST,     'Rest',    C.green],
    [NODE_TYPE.TREASURE, 'Loot',    C.cyan],
    [NODE_TYPE.START,    'Start',   C.holy],
  ];
  const cellW = Math.floor((W - 8) / 4);
  legendItems.forEach((item, i) => {
    const row = Math.floor(i / 4), cl = i % 4;
    const gx = 10 + cl * cellW + 7, gy = 260 + row * 17;
    ctx.fillStyle = NODE_DISC;
    ctx.beginPath(); ctx.arc(gx, gy, 5.5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = item[2]; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(gx, gy, 5.5, 0, Math.PI*2); ctx.stroke();
    drawNodeGlyph(item[0], gx, gy, item[2]);
    text(item[1], gx + 9, gy + 3, C.dim, 4, 'left');
  });
}

// Get the next expected word for highlighting
function getExpectedWord() {
  if (!combat || !combat.verses || game.verseHighlight < 0) return '';
  let idx = game.verseHighlight;
  for (const v of combat.verses) {
    const w = verseWords(v);
    if (w && idx < w.length) return w[idx].toLowerCase();
    if (w) idx -= w.length;
  }
  return '';
}

  // ══ VERSE REFERENCE BOX (y:108-124) — prominent, above the pool ══

  strokeRect(6, refY, W-12, refH, C.gold);
  text('VERSE', 12, refY+5, C.gold, 6, 'left');
  let rxp = 58;
  combat.verses.forEach((vc) => {
    const col = verseTypeColor(vc.type);

  // ══ SELECTED WORDS AREA — auto-sizes to fit the verse ══
  const selWords = combat.selected.map(i => combat.pool[i].word);
  const selText = selWords.join(' ');
  // Measure how many lines we need
  setFont(Math.round(7 * S));
  const maxLineW = W - 24;
  const words2 = selText.split(' ');
  const lines2 = []; let line2 = '';
  for (const w of words2) {
    const test = line2 ? line2 + ' ' + w : w;
    if (ctx.measureText(test).width > maxLineW && line2) { lines2.push(line2); line2 = w; } else line2 = test;
  }
  if (line2) lines2.push(line2);
  const numLines = Math.max(1, lines2.length);
  // Font size adapts: shrink if >2 lines
  let fontSize = numLines <= 2 ? 7 : (numLines <= 3 ? 6 : 5);
  const lineH = fontSize + 4;
  const selH = Math.max(20, numLines * lineH + 8);
  const selY = 126;
  rect(6, selY, W-12, selH, C.stoneDark);
  strokeRect(6, selY, W-12, selH, C.holy);
  if (selWords.length === 0) {
    text('Tap words above...', 12, selY + selH/2 - 4, C.dim, 7, 'left');
  } else {
    setFont(Math.round(fontSize * S));
    let sy = selY + 4;
    for (const l of lines2) {
      text(l, 12, sy, C.holy, fontSize, 'left');
      sy += lineH;
    }
  }

  // ══ WORD POOL — starts below the auto-sized selection area ══
  const startY = selY + selH + 4;
  const cols = 4, bw = 91, gx = 3, gy = 3;
  // Fit EVERY pool tile on screen. The grid used to hard-break at y+bh > 243,
  // so any pool longer than the last row left words invisible AND unclickable —
  // which made those verses impossible to complete. Tile height now adapts to
  // the pool size so capacity can never be exceeded.
  const _rows = Math.max(1, Math.ceil(combat.pool.length / cols));
  const _avail = Math.max(24, 243 - startY);
  const bh = Math.max(6, Math.min(20, Math.floor(_avail / _rows) - gy));
  for (let i = 0; i < combat.pool.length; i++){
    const c = i % cols, row = Math.floor(i / cols);
    const x = 6 + c * (bw + gx);
    const y = startY + row * (bh + gy);
    if (y + bh > 243) break;
    const used = combat.selected.includes(i);
    const tok = combat.pool[i];
    const vcol = tok.v >= 0 ? verseTypeColor(combat.verses[tok.v].type) : (tok.v === -2 ? C.purple : C.dim);
    const hovered = pointIn(pointer.x, pointer.y, x, y, bw, bh);
    if (used){
      rect(x, y, bw, bh, C.gold);
    } else {
      ctx.save();
      if (hovered){ ctx.shadowColor = vcol; ctx.shadowBlur = 6; }
      rect(x, y, bw, bh, '#11122a');
      ctx.restore();
    }
    strokeRect(x, y, bw, bh, used ? C.white : vcol);
    ctx.fillStyle = vcol; ctx.fillRect(x+3, y+3, 5, 5);
    let label = tok.word;
    // Fit the label to the tile: shrink the size that is ACTUALLY drawn until it
    // measures inside the tile's inner width. The previous version computed a
    // shrink factor in `fs` and then drew at a different size (`tsize`), so any
    // word wider than the tile — e.g. "Wherefore" — ran past the right edge and
    // the bounds guard clipped it to "Wherefo…". The word you are choosing from
    // is the one string on screen that must never be truncated.
    const isNextWord = (game.verseHighlight >= 0 && tok.word.toLowerCase() === getExpectedWord() && !used);
    const innerW = bw - 12, textX = x + 6;
    let tsize = Math.max(4, Math.min(7, bh * 0.55));
    let guard = 0;
    while (tsize > 4 && guard++ < 24){
      setFont(Math.round(tsize * S));
      if (ctx.measureText(label).width <= innerW) break;
      tsize -= 0.25;
    }
    const ty = y + Math.max(1, (bh - tsize * S) / 2);
    if (isNextWord) {
      ctx.save(); ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 10;
      text(label, textX, ty, C.gold, tsize, 'left');
      ctx.restore();
    } else {
      text(label, textX, ty, used ? C.bg : C.white, tsize, 'left');
    }
    clickables.push({ x, y, w: bw, h: bh, onClick: () => selectWord(i) });
  }

  // ══ BOTTOM ACTION BAR (y:247-261) — timer, items, run, bible ══
  // Timer thin bar (just below pool) — only counts down when enabled
  const tFrac = game.timerEnabled
    ? Math.max(0, Math.min(1, combat.timer / combat.maxTimer))
    : Math.min(1, combat.timer / Math.max(1, combat.maxTimer * 3));
  const tCol = tFrac > 0.5 ? C.green : tFrac > 0.2 ? C.gold : C.red;
  rect(6, 245, W-12, 2, C.stone);
  rect(6, 245, (W-12) * tFrac, 2, tCol);

  // Submit / Clear / Undo (left cluster) — no overlap with items
  button(6, 247, 44, 14, 'HIT', () => submitVerse(), C.gold, C.bg, C.gold);
  button(54, 247, 38, 14, 'CLR', () => clearSelection(), C.blue, C.white, C.stone);
  button(96, 247, 38, 14, 'UNDO', () => { if (combat && combat.selected.length > 0) combat.selected.pop(); }, C.dim, C.white, C.stone);

  // Items (middle, capped to avoid colliding with RUN/BIBLE)
  const items = game.items || [];
  let ix = 138;
  for (let i = 0; i < items.length && ix < 268; i++){
    const def = ITEM_DEFS[items[i]];
    button(ix, 247, 36, 14, def.icon + def.name.split(' ')[0], () => useItem(i), C.blue, C.white, C.stone);
    ix += 38;
  }
  if (items.length === 0) text('No items', 138, 250, C.dim, 5, 'left');

  // RUN + BIBLE (right cluster) — clearly visible
  if (!(combat.isLust && !combat.lustBroken)){
    const pct = calcEscapeChance();
    button(W-110, 247, 52, 14, 'RUN ' + pct + '%', () => tryFlee(), C.red, C.white, C.stone);
  }
  button(W-54, 247, 52, 14, 'BIBLE', () => { game.bibleOpen = !game.bibleOpen; }, C.purple, C.white, C.stone);

  // sparkle particles + flashes
  drawParticles();
  drawFloatingText();
  if (game.goldFlash > 0){ rect(0,0,W,H,'rgba(255,215,0,'+(game.goldFlash*0.35)+')'); }
  if (game.flash > 0){ rect(0,0,W,H,'rgba(204,51,51,'+(game.flash)+')'); }

  if (game.bibleOpen) {
    const discIds = KnowledgeSystem.store.discoveredVerses || [];
    renderBible(ctx, W, H, discIds, game.biblePage, game.bibleScroll);
  }
  if (game.shakeTimer > 0) ctx.restore();
}

// Apply a resolved EventEngine effect object (already from EventEngine.generate)
function applyEventEffectResult(effect, cost){
  if (!effect) return 'Nothing happens.';
  let msg = effect.text || '...';

  if (effect.heal){
    game.hp = Math.min(game.maxHp, game.hp + effect.heal);
  }
  if (effect.gold){
    game.gold = Math.max(0, game.gold + effect.gold);
  }
  if (effect.shield){
    game.shield += effect.shield;
  }
  if (effect.buff){
    if (effect.buff === 'attack') game.attackBuff += (effect.buffMultiplier ? effect.buffMultiplier : 3);
    else if (effect.buff === 'defense') game.defenseBuff += 2;
    else if (effect.buff === 'wisdom' || effect.buff === 'fire'){
      // Temporary boost flagged for next verse multiplier
      game._tempBuff = game._tempBuff || {};
      game._tempBuff[effect.buff] = 0.5;
    }
  }
  if (effect.hpCost){
    game.hp = Math.max(1, game.hp - effect.hpCost);
  }
  if (effect.learnVerse){
    const v = getRandomVerse(game.floor);
    KnowledgeSystem.discoverVerse(v.id);
    game.discoveredCount = KnowledgeSystem.store.discoveredVerses.length;
    msg += '  Learned: "' + v.text + '" (' + v.reference + ')';
  }
  if (effect.revealWeakness){
    msg += '  (A demon\'s weakness is now known.)';
  }
  if (effect.revealAll || effect.revealTruth){
    msg += '  All weaknesses revealed.';
  }
  if (effect.revealMap || effect.revealMapNode){
    msg += '  The map reveals hidden paths.';
  }
  if (effect.invincible && combat){
    combat.invincibleTurns = (combat.invincibleTurns || 0) + effect.invincible;
  }
  if (effect.startCombat){
    activeEvent = null;
    const fake = { type: effect.multiEnemy ? NODE_TYPE.ELITE : NODE_TYPE.COMBAT };
    startCombat(fake);
    return null; // state changed to COMBAT
  }
  if (effect.permanentKnowledge){
    msg += '  (Recorded in your knowledge.)';
  }
  if (effect.storeHeal){
    game._storedHeal = (game._storedHeal || 0) + effect.storeHeal;
  }
  return msg;
}

// ═══════════════════════════════════════════════════════════════
// LOOP
// ═══════════════════════════════════════════════════════════════
let lastT = performance.now();
function loop(now){
  // ponytail: one frame can never kill the game — an uncaught throw here used to
  // stop requestAnimationFrame forever, freezing the canvas on the last drawn frame.
  try { tick(now); } catch (e) {
    // Show it on screen — a silent stall is undiagnosable on someone else's device.
    if (window.__sfLastErr !== String(e && e.message)) {
      window.__sfLastErr = String(e && e.message);
      console.error('SEVEN FALLS frame error:', e);
    }
    try {
      ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, W, 20);
      ctx.fillStyle = '#ff6666'; ctx.font = '8px monospace'; ctx.textAlign = 'left';
      ctx.fillText('ERR: ' + String(e && e.message).slice(0, 52), 4, 13);
    } catch (_) {}
  }
  requestAnimationFrame(loop);
}
function tick(now){
  // ponytail: clamp dt — a long or NaN frame must not freeze/teleport animations
  const dt = Math.min(0.1, Math.max(0, (now - lastT) / 1000)) || 0.016;
  lastT = now;

  // combat timer
  if (game.state === 'COMBAT' && combat){
    // swarm mode countdown
    if (combat.isSwarm && CombatTwists.swarmMode){
      const s = CombatTwists.updateSwarm(dt);
      combat.swarmTimer = CombatTwists.swarmTimer;
      combat.swarmCount = CombatTwists.swarmCount;
      if (s && s.expired){
        combat.isSwarm = false;
        combat.twistTriggered.push('The swarm is broken!');
        CombatTwists.swarmMode = false;
      }
    }
    if (game.timerEnabled){
      const prevTimer = combat.timer;
      combat.timer -= dt;
      // Easter egg: floor 7, timer crosses 7.77
      if (game.floor === 7 && prevTimer > 7.77 && combat.timer <= 7.77 && !combat._easterEgg777){
        combat._easterEgg777 = true;
        game._triggeredEasterEgg = true;
        combat.message = '7:77 — "I will open my mouth in parables"';
        combat.msgTimer = 2.5;
        game.hp = Math.min(game.maxHp, game.hp + 7);
        game.gold += 77;
        if (typeof SFX !== 'undefined') SFX.play('buff');
        game.goldFlash = 1.0;
      }
      if (combat.timer <= 0){
        combat.message = 'TIME! The demon strikes!';
        combat.msgTimer = 1.2;
        combat.correctStreak = 0;
        combat.comboResult = null;
        combat.twistTriggered = [];
        combat.selected = [];
        demonAttack(true);
        if (game.hp <= 0){ die(); }
        else loadVerse();
      }
    } else {
      // timer disabled: count up as a 'suggested pace' readout, never auto-submits
      combat.timer += dt;
    }
    if (combat.msgTimer > 0) combat.msgTimer -= dt;
  // Verse word highlight timer
  if (game.verseHighlight >= 0) {
    game.verseHighlightTimer += dt;
    if (game.verseHighlightTimer > 3) { // highlight each word for 3 seconds
      game.verseHighlightTimer = 0;
      game.verseHighlight++;
      const vs = combat.verses || [];
      let maxIdx = 0;
      for (const v of vs) { const w = verseWords(v); if (w) maxIdx += w.length; }
      if (game.verseHighlight >= maxIdx) game.verseHighlight = -1; // done
    }
  }
  }
  // visual decays (run even outside combat so sparkles finish)
  if (game.flash > 0) game.flash = Math.max(0, game.flash - dt);
  if (game.goldFlash > 0) game.goldFlash = Math.max(0, game.goldFlash - dt * 1.2);
  if (game.comboAnim > 0) game.comboAnim = Math.max(0, game.comboAnim - dt);
  if (game.shakeTimer > 0) game.shakeTimer = Math.max(0, game.shakeTimer - dt);
  if (typeof MECH !== 'undefined') MECH.tickFlow(dt);
  if (typeof Achievements !== 'undefined') Achievements.update(dt);
  if (typeof ScreenFX !== 'undefined') ScreenFX.update(dt);
  updateParticles(dt);
  // hint auto-dismiss
  if (game.activeHint){
    game.activeHint.timer -= dt;
    if (game.activeHint.timer <= 0) dismissHint();
  }

  render();
}

// ═══════════════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════════════
function toCanvas(e){
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W;
  const y = (e.clientY - r.top) / r.height * H;
  return { x, y };
}
canvas.addEventListener('pointermove', e => { pointer = toCanvas(e); });
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  // ponytail: a phone has no keyboard — the old keydown-only intro was a dead end on mobile.
  if (game.state === 'INTRO' && introStep < INTRO_LINES.length - 1){ introAdvance(); return; }
  const p = toCanvas(e);
  // Click on the hint overlay dismisses it
  if (game.activeHint && pointIn(p.x, p.y, 6, H-32, W-12, 30)){ dismissHint(); return; }
  // Bible UI intercepts clicks when open (but only within its bounds)
  if (game.bibleOpen) {
    // Bible panel bounds (matches renderBible drawing area)
    const bx = 10, by = 10, bw = W-20, bh = H-20;
    if (p.x >= bx && p.x <= bx+bw && p.y >= by && p.y <= by+bh) {
      const discIds = KnowledgeSystem.store.discoveredVerses || [];
      const result = handleBibleClick(p.x, p.y, discIds, game.biblePage, game.bibleScroll);
      if (result) {
        if (result.action === 'back') game.bibleOpen = false;
        else if (result.page) game.biblePage = result.page;
        if (result.scrollY !== undefined) game.bibleScroll = result.scrollY;
      }
      return; // consumed by bible
    }
    // Click OUTSIDE bible = close it
    game.bibleOpen = false;
    return;
  }
  for (let i = clickables.length - 1; i >= 0; i--){
    const c = clickables[i];
    if (p.x >= c.x && p.x <= c.x + c.w && p.y >= c.y && p.y <= c.y + c.h){
      if (c.onClick) c.onClick();
      clickables = []; // ponytail: consume — a stale frame's array must not fire twice
      return;
    }
  }
});

window.addEventListener('keydown', e => {
  if (game.state === 'INTRO'){ introAdvance(); return; }
  if (game.state === 'COMBAT' && combat){
    if (e.key >= '1' && e.key <= '9'){
      const idx = parseInt(e.key, 10) - 1;
      if (idx < combat.pool.length) selectWord(idx);
    } else if (e.key === 'Enter'){
      submitVerse();
    } else if (e.key === 'b' || e.key === 'B') { game.bibleOpen = !game.bibleOpen; if (game.bibleOpen && !game.hintsShown['bible']) showHint('bible', 'Press B to open your Bible. Click outside to close.', true); } else if (e.key === 'Escape' && game.bibleOpen) { game.bibleOpen = false; } else if (e.key === 'Backspace'){
      e.preventDefault();
      combat.selected.pop();
    } else if (e.key === ' '){
      e.preventDefault();
      clearSelection();
    }
  }
});

// ── QA hook ──────────────────────────────────────────────────────────────────
// Exposes internals for automated browser testing and design review.
// Strictly read-only handles — no game code reads from window.SF.
window.SF = {
  get state(){ return game.state; },
  get game(){ return game; },
  get map(){ return mapState ? mapState.map : null; },
  get combat(){ return combat; },
  get colors(){ return C; },
  get dims(){ return { W, H }; },
  nodePos, canMoveTo, nodeType: NODE_TYPE,
  // ── QA drivers ──────────────────────────────────────────────────────────────
  // These call the game's own entry points, so every screen they reach is the
  // real renderer with real state — nothing is faked for the screenshots.
  enterNode, die, winCombat, submitVerse, selectWord, clearSelection,
  jump(type){ enterNode({ type }); },
  solveCombat(){ if (combat) winCombat(); },
  reachable(){ const m = mapState && mapState.map; if(!m) return [];
    return m.nodes.filter(n => canMoveTo(n.id)).map(n => { const p = nodePos(n, m.totalRows); return { id:n.id, type:n.type, x:p.x, y:p.y }; }); },
  allNodes(){ const m = mapState && mapState.map; if(!m) return [];
    return m.nodes.map(n => { const p = nodePos(n, m.totalRows); return { id:n.id, type:n.type, x:p.x, y:p.y, visited:m.visited.has(n.id) }; }); }
};

// Boot after the pixel font is ready so the first frame is laid out with the
// real metrics (canvas fillText never waits for a font on its own).
if (document.fonts && document.fonts.load){
  Promise.race([
    document.fonts.load('8px "Press Start 2P"').catch(() => {}),
    new Promise(r => setTimeout(r, 1500)),
  ]).then(() => requestAnimationFrame(loop));
} else {
  requestAnimationFrame(loop);
}
</script>
